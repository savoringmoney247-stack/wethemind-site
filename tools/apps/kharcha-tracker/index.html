;justify-content:space-between}.balance-row .summary-label{margin-bottom:0}.balance-bar{margin-top:14px;height:4px;background:var(--surface2);border-radius:999px;overflow:hidden}.balance-fill{height:100%;background:linear-gradient(90deg,var(--earn),var(--accent));border-radius:999px;transition:width .5s cubic-bezier(.23,1,.32,1)}.tabs{display:flex;gap:6px;padding:16px 20px 0}.tab-btn{flex:1;padding:10px;border-radius:10px;font-size:.8rem;font-weight:500;letter-spacing:.03em;color:var(--muted);background:var(--surface);border:1px solid var(--border);transition:all .18s}.tab-btn.active{color:var(--bg);border-color:transparent}.tab-btn.active.earn-tab{background:var(--earn)}.tab-btn.active.spend-tab{background:var(--spend)}.tab-btn.active.history-tab{background:var(--accent)}.panel{display:none;padding:16px 20px 0}.panel.active{display:block}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:.68rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.form-control{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.95rem;transition:border-color .15s,box-shadow .15s}.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,110,.12)}.form-control::placeholder{color:var(--muted)}select.form-control option{background:#1e1e2a}.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn-add{width:100%;padding:13px;border-radius:10px;font-size:.9rem;font-weight:500;letter-spacing:.04em;transition:opacity .15s,transform .1s;margin-top:4px}.btn-add:active{transform:scale(.98)}.btn-add.earn{background:var(--earn);color:var(--bg)}.btn-add.spend{background:var(--spend);color:#fff}.tx-list{padding:0 20px}.tx-section-label{font-size:.65rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 0 8px}.tx-item{display:flex;align-items:center;gap:12px;background:var(--surface); ://wethemind.com/assets/og-image.png" property="og:image"/><meta content="1200" property="og:image:width"/><meta content="630" property="og:image:height"/><meta content="We The Mind — one mind, every curriculum" property="og:image:alt"/><meta content="summary_large_image" name="twitter:card"/><meta content="Kharcha — Daily Finance Tracker" name="twitter:title"/><meta content="Daily Earnings &amp; Expense Tracker — Know where every rupee goes." name="twitter:description"/><meta content="https://wethemind.com/assets/og-image.png" name="twitter:image"/><link href="https://wethemind.com/tools/apps/kharcha-tracker/" hreflang="en-us" rel="alternate"/><link href="https://wethemind.com/tools/apps/kharcha-tracker/" hreflang="x-default" rel="alternate"/><script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://wethemind.com/"}, {"@type": "ListItem", "position": 2, "name": "Tools", "item": "https://wethemind.com/tools/"}, {"@type": "ListItem", "position": 3, "name": "Apps", "item": "https://wethemind.com/tools/apps/"}, {"@type": "ListItem", "position": 4, "name": "Kharcha Tracker", "item": "https://wethemind.com/tools/apps/kharcha-tracker/"}]}</script><link rel="apple-touch-icon" href="icon-192.png" /><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" /></head> <body><h1 class="sr-only">Kharcha</h1> <div class="app" id="app"> <header> <div class="logo">Kharcha <span>/ tracker</span></div> <div class="date-pill" id="headerDate">—</div> </header> <div id="installBanner"> <p>Add <span>Kharcha</span> to your home screen for quick access.</p> <button class="btn-install" id="installBtn">Install</button> <button class="btn-dismiss" id="dismissInstall">✕</button> </div> <div class="date-nav"> <button id="prevDay" title="Previous day"> <svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><polyline points="15 18 9 12 1 d"> <div class="form-group"> <label>Description</label> <input class="form-control" id="spendDesc" placeholder="Groceries, rent, coffee…" type="text"/> </div> <div class="row-2"> <div class="form-group"> <label>Amount (₹)</label> <input class="form-control" id="spendAmt" min="0" placeholder="0" type="number"/> </div> <div class="form-group"> <label>Category</label> <select class="form-control" id="spendCat"> <option>🛒 Groceries</option> <option>🍜 Food &amp; Dining</option> <option>🚌 Transport</option> <option>🏠 Rent</option> <option>💊 Health</option> <option>🎮 Entertainment</option> <option>👗 Shopping</option> <option>💡 Utilities</option> <option>📚 Education</option> <option>🤝 Other</option> </select> </div> </div> <button class="btn-add spend" onclick='addTransaction("spend")'>Add Expense</button> <div class="tx-list" id="spendList"></div> </div> <div class="panel" id="panel-history"> <div id="historyContent"></div> </div> </div> <nav> <button class="nav-item active" data-nav="earn" onclick='switchNav("earn")'> <svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg> Earn </button> <button class="nav-item" data-nav="spend" onclick='switchNav("spend")'> <svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path><path d="M12 6v6l4 2"></path></svg> Spend </button> <button class="nav-item" data-nav="history" onclick='switchNav("history")'> <svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="7" rx="1" width="7" x="3" y="3"></rect><rect height="7" rx="1" width="7" x="14" y="3"></rect><rect height="7" rx="1" width="7" x="3" y="14"></rect><rect height="7" rx="1" width="7" x="14" y="14"></rect></svg> History </button> </nav> <div class="toast" id="toast"></div> <script>const KEY="kharcha_v1";let currentDate=todayStr();let data=load();let deferredPrompt=null;function todayStr(){return(new Date).toISOString().split("T")[0]}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getDayData(d){if(!data[d])data[d]={earn:[],spend:[]};return data[d]}function formatDisplay(str){const d=new Date(str+"T00:00:00");const today=todayStr();const yesterday=new Date;yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().split("T")[0];if(str===today)return"Today";if(str===yStr)return"Yesterday";return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}function updateDateUI(){document.getElementById("navDate").textContent=formatDisplay(currentDate);document.getElementById("headerDate").textContent=new Date(currentDate+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});document.getElementById("datePicker").value=currentDate}document.getElementById("prevDay").onclick=()=>{shiftDay(-1)};document.getElementById("nextDay").onclick=()=>{shiftDay(1)};document.getElementById("navDate").onclick=()=>{document.getElementById("datePicker").showPicker?.()||document.getElementById("datePicker").click()};document.getElementById("datePicker").addEventListener("change",e=>{if(e.target.value){currentDate=e.target.value;render()}});function shiftDay(d){const dt=new Date(currentDate+"T00:00:00");dt.setDate(dt.getDate()+d);const next=dt.toISOString().split("T")[0];const today=todayStr();if(next>today){showToast("Can't go to future dates");return}currentDate=next;render()}function addTransaction(type){const desc=document.getElementById(type+"Desc").value.trim();const amt=parseFloat(document.getElementById(type+"Amt").value);const cat=document.getElementById(type+"Cat").value;if(!desc){showToast("Please enter a description");return}if(!amt||amt<=0){showToast("Enter a valid amount");return}const day=getDayData(currentDate);day[type].push({id:Date.now(),desc:desc,amt:amt,cat:cat,time:(new Date).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});save();document.getElementById(type+"Desc").value="";document.getElementById(type+"Amt").value="";render();showToast(type==="earn"?"✅ Earning added":"✅ Expense added")}function deleteTx(type,id){const day=getDayData(currentDate);day[type]=day[type].filter(t=>t.id!==id);save();render();showToast("Deleted")}function fmt(n){return"₹"+n.toLocaleString("en-IN",{minimumFractionDigits:0})}function renderList(type,containerId){const day=getDayData(currentDate);const list=day[type];const el=document.getElementById(containerId);if(!list.length){el.innerHTML=`<div class="empty-state"><div class="emoji">${type==="earn"?"💸":"🧾"}</div><p>No ${type==="earn"?"earnings":"expenses"} recorded for this day.</p></div>`;return}el.innerHTML=`<div class="tx-section-label">${list.length} record${list.length>1?"s":""}</div>`+list.slice().reverse().map(t=>`\n    <div class="tx-item">\n      <div class="tx-icon ${type}">${t.cat.split(" ")[0]}</div>\n      <div class="tx-info">\n        <div class="tx-desc">${t.desc}</div>\n        <div class="tx-meta">${t.cat.split(" ").slice(1).join(" ")} · ${t.time}</div>\n      </div>\n      <div class="tx-amount ${type}">${type==="earn"?"+":"−"}${fmt(t.amt)}</div>\n      <button class="tx-delete" onclick="deleteTx('${type}',${t.id})" title="Delete">\n        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>\n      </button>\n    </div>`).join("")}function renderSummary(){const day=getDayData(currentDate);const earn=day.earn.reduce((s,t)=>s+t.amt,0);const spend=day.spend.reduce((s,t)=>s+t.amt,0);const bal=earn-spend;document.getElementById("sumEarn").textContent=fmt(earn);document.getElementById("sumSpend").textContent=fmt(spend);document.getElementById("sumBalance").textContent=fmt(bal);document.getElementById("sumBalance").style.color=bal>=0?"var(--earn)":"var(--spend)";const pct=earn?Math.min(100,earn/(earn+spend)*100):50;document.getElementById("balanceFill").style.width=pct+"%"}function renderHistory(){const el=document.getElementById("historyContent");const months={};Object.keys(data).sort((a,b)=>b.localeCompare(a)).forEach(d=>{const[y,m]=d.split("-");const key=y+"-"+m;if(!months[key])months[key]={earn:0,spend:0,days:0};const day=data[d];months[key].earn+=day.earn?.reduce((s,t)=>s+t.amt,0)||0;months[key].spend+=day.spend?.reduce((s,t)=>s+t.amt,0)||0;months[key].days++});if(!Object.keys(months).length){el.innerHTML=`<div class="empty-state"><div class="emoji">📊</div><p>No history yet. Start tracking your finances!</p></div>`;return}el.innerHTML=Object.entries(months).map(([k,m])=>{const[y,mo]=k.split("-");const label=new Date(y,mo-1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});const bal=m.earn-m.spend;return`\n    <div class="month-summary">\n      <div class="month-title">${label}</div>\n      <div class="month-stats">\n        <div class="month-stat">\n          <div class="month-stat-val" style="color:var(--earn)">${fmt(m.earn)}</div>\n          <div class="month-stat-lbl">Earned</div>\n        </div>\n        <div class="month-stat">\n          <div class="month-stat-val" style="color:var(--spend)">${fmt(m.spend)}</div>\n          <div class="month-stat-lbl">Spent</div>\n        </div>\n        <div class="month-stat">\n          <div class="month-stat-val" style="color:${bal>=0?"var(--earn)":"var(--spend)"}">${fmt(bal)}</div>\n          <div class="month-stat-lbl">Balance</div>\n        </div>\n        <div class="month-stat">\n          <div class="month-stat-val" style="color:var(--accent)">${m.days}</div>\n          <div class="month-stat-lbl">Days</div>\n        </div>\n      </div>\n    </div>`}).join("")}function render(){updateDateUI();renderSummary();renderList("earn","earnList");renderList("spend","spendList");renderHistory()}function switchNav(tab){document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.nav===tab));document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+tab))}document.querySelectorAll(".tab-btn").forEach(btn=>{btn.addEventListener("click",()=>switchNav(btn.dataset.tab))});let toastTimer;function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const banner=document.getElementById("installBanner");banner.style.display="flex"});document.getElementById("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const{outcome:outcome}=await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBanner").style.display="none"};document.getElementById("dismissInstall").onclick=()=>{document.getElementById("installBanner").style.display="none"};if("serviceWorker"in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}document.addEventListener("keydown",e=>{if(e.key==="Enter"){const active=document.querySelector(".panel.active");if(active?.id==="panel-earn")addTransaction("earn");else if(active?.id==="panel-spend")addTransaction("spend")}});render()</script> </body> </html>
