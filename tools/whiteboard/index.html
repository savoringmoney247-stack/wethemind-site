<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="description" content="Whiteboard — an infinite-canvas whiteboard with pressure-sensitive drawing, sticky notes, smart shape constraints, focus mode, and elegant PDF export.">
<meta name="theme-color" content="#0f1014">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Whiteboard">
<meta property="og:description" content="An infinite canvas for sketching, planning, and presenting.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b9d'/%3E%3Cstop offset='0.5' stop-color='%23c268f0'/%3E%3Cstop offset='1' stop-color='%236a8dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='18' cy='18' r='16.5' fill='url(%23g)'/%3E%3Cpath d='M11 22 L15 22 L25 12 L21 8 L11 18 Z' fill='%23fff' opacity='0.92'/%3E%3C/svg%3E">
<title>Whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-void: #08090c;
  --bg-deep: #0f1014;
  --bg-card: #16181d;
  --bg-elev: #1e2027;
  --line: rgba(255,255,255,0.06);
  --line-strong: rgba(255,255,255,0.11);
  --ink: #f0f0f2;
  --ink-mid: #9c9da6;
  --ink-dim: #5f606a;
  --gold: #d4a574;
  --gold-bright: #f0c08a;
  --gold-soft: rgba(212,165,116,0.14);
  --gold-glow: rgba(240,192,138,0.42);
  --crimson: #c2585b;
  --azure: #6eaadb;
  --paper: #fdfbf6;
  --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'Manrope', system-ui, sans-serif;
  --hand: 'Caveat', cursive;
  --mono: 'JetBrains Mono', monospace;
  --t: 200ms cubic-bezier(0.2,0.8,0.2,1);
  --t-spring: 320ms cubic-bezier(0.34,1.56,0.64,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg-void);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212,165,116,0.05), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(110,170,219,0.04), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(194,88,91,0.025), transparent 50%);
  user-select: none;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* Soothing continuous ambient animation — slow drifting glow, not distracting */
#ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#ambient span { position: absolute; border-radius: 50%; filter: blur(90px); }
#ambient .a1 {
  width: 42vw; height: 42vw; top: -12%; left: -10%;
  background: radial-gradient(circle, rgba(255,107,157,0.13), transparent 70%);
  animation: driftA 46s ease-in-out infinite alternate;
}
#ambient .a2 {
  width: 46vw; height: 46vw; bottom: -16%; right: -12%;
  background: radial-gradient(circle, rgba(106,141,255,0.11), transparent 70%);
  animation: driftB 54s ease-in-out infinite alternate;
}
#ambient .a3 {
  width: 34vw; height: 34vw; top: 38%; left: 46%;
  background: radial-gradient(circle, rgba(194,104,240,0.10), transparent 70%);
  animation: driftC 60s ease-in-out infinite alternate;
}
@keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(4vw, 5vw) scale(1.12); } }
@keyframes driftB { from { transform: translate(0,0) scale(1); } to { transform: translate(-5vw, -4vw) scale(1.08); } }
@keyframes driftC { from { transform: translate(0,0) scale(1); } to { transform: translate(-3vw, 4vw) scale(0.94); } }
@media (prefers-reduced-motion: reduce) {
  #ambient span { animation: none !important; }
}

/* Welcome */
#welcome {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg-void);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px;
  transition: opacity 700ms ease, visibility 700ms;
}
#welcome.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.welcome-svg { width: 110px; height: 110px; filter: drop-shadow(0 0 40px rgba(240,192,138,0.35)); }
.welcome-svg .ring {
  fill: none; stroke: var(--gold-bright); stroke-width: 1.4;
  stroke-dasharray: 320; stroke-dashoffset: 320;
  animation: drawRing 900ms ease-out 100ms forwards;
}
.welcome-svg .flourish {
  fill: none; stroke: url(#welcomeGrad); stroke-width: 6;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 220; stroke-dashoffset: 220;
  animation: drawK 1100ms ease-out 500ms forwards;
}
.welcome-svg .dot { fill: var(--crimson); opacity: 0; animation: dotPop 400ms ease-out 1700ms forwards; }
@keyframes drawRing { to { stroke-dashoffset: 0; } }
@keyframes drawK    { to { stroke-dashoffset: 0; } }
@keyframes dotPop   { 0% { opacity: 0; transform: scale(0); transform-origin: 84px 26px; } 60% { transform: scale(1.4); } 100% { opacity: 1; transform: scale(1); } }
.welcome-title {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(40px, 6vw, 64px);
  letter-spacing: -0.025em; line-height: 1;
  opacity: 0; animation: fadeUp 1s ease 1100ms forwards;
}
.welcome-title em { color: var(--gold-bright); font-style: italic; }
.welcome-sub {
  font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--ink-dim); font-family: var(--mono);
  opacity: 0; animation: fadeUp 1s ease 1500ms forwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* Layout */
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; margin-left: 104px; transition: margin-left 320ms cubic-bezier(0.4,0,0.2,1); }
body.sidebar-expanded .app { margin-left: 280px; }
body.focus-mode .app { margin-left: 0; }

.topbar {
  display: flex; align-items: center; padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--bg-deep), rgba(15,16,20,0.85));
  backdrop-filter: blur(20px);
  position: relative; z-index: 20;
}
.topbar::after {
  content: ''; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-soft) 30%, var(--gold-soft) 70%, transparent);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 34px; height: 34px; position: relative; transition: transform var(--t); }
.brand:hover .brand-mark { transform: rotate(-6deg); }
.brand-mark svg { width: 100%; height: 100%; }
.brand-name { font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: -0.015em; line-height: 1; }
.brand-name em { color: var(--gold-bright); }
.brand-name .by {
  display: block; font-family: var(--mono); font-style: normal;
  font-size: 8.5px; letter-spacing: 0.38em; text-transform: uppercase;
  color: var(--ink-dim); margin-top: 4px;
}
.topbar-status {
  display: flex; align-items: center; gap: 8px;
  margin-left: 28px; padding: 6px 12px;
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 999px; font-size: 11.5px; color: var(--ink-mid);
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold-bright);
  box-shadow: 0 0 8px var(--gold-glow);
  animation: pulse 2.4s infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
.topbar-status strong { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.format-toggle {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 12px; border-radius: 999px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,107,157,0.16), rgba(194,104,240,0.16) 45%, rgba(106,141,255,0.16));
  border: 1px solid rgba(255,255,255,0.14);
  color: var(--ink); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease, background 200ms ease;
}
.format-toggle:hover {
  border-color: rgba(255,255,255,0.32);
  box-shadow: 0 4px 16px rgba(150,90,255,0.35);
  transform: translateY(-1px);
}
.format-toggle.open {
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 1px rgba(240,192,138,0.25), 0 4px 16px rgba(150,90,255,0.35);
}
.format-toggle .format-icon { width: 15px; height: 15px; color: var(--gold-bright); flex-shrink: 0; }
.format-toggle .format-chevron { width: 12px; height: 12px; color: var(--ink-mid); transition: transform 200ms ease; flex-shrink: 0; }
.format-toggle.open .format-chevron { transform: rotate(180deg); }
.actions { display: flex; align-items: center; gap: 4px; }
.icon-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 11px; color: var(--ink-mid);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), background 220ms ease, color 220ms ease, box-shadow 220ms ease;
  position: relative;
}
.icon-btn:hover {
  background: linear-gradient(135deg, #ff6b9d, #c268f0 45%, #6a8dff);
  color: #fff; transform: translateX(3px) scale(1.06);
  box-shadow: 0 4px 14px rgba(150,90,255,0.4);
}
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.icon-btn:disabled:hover { background: none; color: var(--ink-mid); transform: none; box-shadow: none; }
.icon-btn svg { width: 16px; height: 16px; }
.pdf-btn {
  height: 38px; padding: 0 16px; margin-left: 0; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #ff6b9d, #c268f0 45%, #6a8dff);
  color: #fff; border-radius: 11px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 4px 14px rgba(150,90,255,0.35);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 220ms ease, filter 220ms ease; position: relative; overflow: hidden;
}
.pdf-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, white, transparent);
  opacity: 0; transition: opacity var(--t);
}
.pdf-btn:hover::before { opacity: 0.25; }
.pdf-btn:hover { box-shadow: 0 6px 22px rgba(150,90,255,0.55); transform: translateX(3px) scale(1.04); filter: brightness(1.06); }
.pdf-btn svg { width: 14px; height: 14px; position: relative; z-index: 1; }
.pdf-btn span { position: relative; z-index: 1; }
.icon-btn.unsaved::after, .pdf-btn.unsaved::after {
  content: ''; position: absolute; top: 3px; right: 3px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--crimson); box-shadow: 0 0 6px rgba(194,88,91,0.7);
  animation: unsavedPulse 1.8s ease-in-out infinite;
  z-index: 2;
}
@keyframes unsavedPulse { 0%,100% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }

.tooltip {
  position: absolute;
  background: var(--bg-void); border: 1px solid var(--line-strong);
  color: var(--ink); font-size: 11px; font-weight: 500;
  padding: 6px 10px; border-radius: 6px;
  white-space: nowrap; pointer-events: none; opacity: 0;
  transition: opacity 150ms ease 250ms; z-index: 200;
}
.tooltip kbd {
  font-family: var(--mono); font-size: 10px;
  background: var(--bg-elev); border-radius: 3px;
  padding: 1px 5px; margin-left: 6px; color: var(--ink-mid);
}
.icon-btn:hover .tooltip, .pdf-btn:hover .tooltip { opacity: 1; }
.topbar .icon-btn .tooltip, .topbar .pdf-btn .tooltip {
  top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
}

/* Stage & canvas */
.stage {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 32px; gap: 18px;
  overflow: hidden;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
}
.canvas-frame {
  position: relative; aspect-ratio: 16 / 9;
  max-width: 100%; max-height: 100%;
}
.canvas-frame::before {
  content: ''; position: absolute; inset: -2px;
  background: linear-gradient(135deg, rgba(212,165,116,0.25), transparent 30%, transparent 70%, rgba(212,165,116,0.18));
  border-radius: 6px; z-index: 0;
}
.canvas-wrap {
  position: relative; width: 100%; height: 100%;
  background: var(--paper); border-radius: 4px; overflow: hidden;
  box-shadow:
    0 24px 80px -16px rgba(0,0,0,0.65),
    0 12px 40px -8px rgba(0,0,0,0.4),
    0 0 0 1px rgba(212,165,116,0.12);
}
.canvas-wrap canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none; display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
#bg-canvas { z-index: 1; pointer-events: none; }
#main-canvas { z-index: 2; }
#active-canvas { z-index: 3; pointer-events: none; }
#laser-canvas { z-index: 4; pointer-events: none; }

.canvas-wrap.tool-pen canvas,
.canvas-wrap.tool-highlighter canvas,
.canvas-wrap.tool-shape canvas {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><circle cx='7' cy='7' r='3.4' fill='%23111' stroke='%23fff' stroke-width='1.4'/></svg>") 7 7, auto;
}
.canvas-wrap.tool-eraser canvas { cursor: none; }
.canvas-wrap.tool-text canvas { cursor: text; }
.canvas-wrap.tool-sticky canvas {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' rx='1' fill='%23fef3a3' stroke='%23000' stroke-width='1.2'/></svg>") 8 8, auto;
}
.canvas-wrap.tool-laser canvas { cursor: none; }
.canvas-wrap.tool-select canvas { cursor: default; }
.canvas-wrap.tool-select.grabbing canvas { cursor: grabbing; }

.sticky-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.sticky {
  position: absolute; pointer-events: auto;
  width: 11vw; min-width: 130px; max-width: 200px; min-height: 100px;
  padding: 14px 14px 12px;
  font-family: var(--hand); font-size: 17px; line-height: 1.3;
  color: #2a2618;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 6px 18px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(0,0,0,0.03);
  transition: transform var(--t-spring), box-shadow var(--t);
  word-wrap: break-word; overflow-wrap: break-word;
}
.sticky::before {
  content: ''; position: absolute; top: -3px; left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 40%; height: 12px; background: rgba(0,0,0,0.06); filter: blur(2px);
}
.sticky:hover {
  transform: scale(1.04) rotate(0deg) !important;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1), 0 16px 36px rgba(0,0,0,0.28);
  z-index: 10;
}
.sticky textarea {
  width: 100%; height: 100%; min-height: 84px;
  background: transparent; border: none; outline: none; resize: none;
  font: inherit; color: inherit;
}
.sticky-close {
  position: absolute; top: 6px; right: 6px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.08); color: rgba(0,0,0,0.55);
  font-size: 13px; line-height: 20px;
  opacity: 0; transition: opacity 150ms;
}
.sticky:hover .sticky-close { opacity: 1; }
.sticky-close:hover { background: rgba(0,0,0,0.2); color: rgba(0,0,0,0.85); }

.text-editor {
  position: absolute; background: transparent;
  border: 1px dashed rgba(0,0,0,0.45); outline: none;
  padding: 4px 6px; z-index: 8;
  font-family: var(--sans); font-weight: 500;
  color: inherit; min-width: 80px; min-height: 24px;
  resize: none; overflow: hidden;
}

.eraser-ring {
  position: absolute;
  border: 1.5px solid rgba(0,0,0,0.5);
  background: rgba(255,255,255,0.5);
  border-radius: 50%; pointer-events: none;
  z-index: 7; transform: translate(-50%, -50%);
  display: none; transition: width 80ms, height 80ms;
  will-change: transform, left, top;
}
.laser-cursor {
  position: absolute;
  width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle, #ff4050, #ff202c);
  box-shadow: 0 0 20px rgba(255,40,60,0.8), 0 0 40px rgba(255,40,60,0.4);
  pointer-events: none; transform: translate(-50%, -50%);
  z-index: 9; display: none;
  will-change: transform, left, top;
}

.selection-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.sel-box {
  position: absolute;
  border: 1.5px solid var(--azure);
  background: rgba(110,170,219,0.08);
  border-radius: 2px;
  box-shadow: 0 0 0 2px rgba(110,170,219,0.18);
}
.sel-label {
  position: absolute;
  font-size: 10px; font-family: var(--mono);
  color: var(--azure); background: var(--bg-void);
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
}
.marquee-box {
  position: absolute; display: none;
  border: 1.5px dashed var(--azure);
  background: rgba(110,170,219,0.1);
  pointer-events: none; z-index: 6;
}

.canvas-watermark {
  position: absolute; bottom: 12px; right: 16px;
  z-index: 6; font-family: var(--serif); font-style: italic;
  font-size: 13px; color: rgba(0,0,0,0.15);
  pointer-events: none; letter-spacing: 0.02em;
}
.canvas-watermark::before { content: '~ '; color: rgba(0,0,0,0.13); }

/* Left sidebar — all options live here, always visible */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 104px; z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 12px 8px 14px;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent;
  background: rgba(15,16,20,0.82);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-right: 1px solid rgba(255,255,255,0.08);
  box-shadow: 8px 0 30px rgba(0,0,0,0.35);
  transition: width 320ms cubic-bezier(0.4,0,0.2,1);
  animation: sidebarIn 600ms cubic-bezier(0.34,1.56,0.64,1) 1900ms backwards;
}
body.sidebar-expanded .sidebar { width: 280px; }
.sidebar > * { flex-shrink: 0; }
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
.sidebar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }

/* Collapse / expand toggle */
.sidebar-toggle {
  position: fixed; top: 50%; left: 88px; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15,16,20,0.95); border: 1.5px solid rgba(255,255,255,0.14);
  color: var(--ink-mid); z-index: 150; cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  transition: left 320ms cubic-bezier(0.4,0,0.2,1), background 200ms ease, color 200ms ease, box-shadow 200ms ease;
}
.sidebar-toggle:hover {
  background: linear-gradient(135deg, #ff6b9d, #c268f0 45%, #6a8dff);
  color: #fff; box-shadow: 0 4px 14px rgba(150,90,255,0.45);
}
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform 320ms cubic-bezier(0.4,0,0.2,1); }
body.sidebar-expanded .sidebar-toggle svg { transform: rotate(180deg); }
body.sidebar-expanded .sidebar-toggle { left: 264px; }
body.focus-mode .sidebar-toggle { opacity: 0; pointer-events: none; transition: opacity 400ms ease; }

/* Expanded layout — icons gain visible text labels */
.btn-label { display: none; font-size: 14.5px; font-weight: 500; white-space: nowrap; opacity: 0; }
body.sidebar-expanded .dock-group,
body.sidebar-expanded .side-group,
body.sidebar-expanded #dock-tools { align-items: stretch; width: 100%; }
body.sidebar-expanded .dock-btn,
body.sidebar-expanded .icon-btn,
body.sidebar-expanded .sidebar .pdf-btn {
  width: 100%; justify-content: center; padding: 0 11px; gap: 11px;
}
body.sidebar-expanded .sidebar .pdf-btn span:not(.btn-label) { display: inline; }
body.sidebar-expanded .btn-label { display: inline-block; opacity: 1; transition: opacity 200ms ease 140ms; }
body.sidebar-expanded .side-colors { grid-template-columns: repeat(5, 1fr); }
body.sidebar-expanded .side-mark { align-self: flex-start; margin-left: 3px; }
.sidebar-fade {
  position: fixed; left: 0; width: 104px; height: 28px; z-index: 101; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(15,16,20,0.85));
  opacity: 0; transition: opacity 200ms ease;
}
.sidebar-fade.show { opacity: 1; }
#sidebar-fade-top { top: 56px; background: linear-gradient(0deg, transparent, rgba(15,16,20,0.85)); }
#sidebar-fade-bottom { bottom: 0; }
@keyframes sidebarIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
.side-mark { width: 30px; height: 30px; margin-bottom: 4px; flex-shrink: 0; }
.side-mark svg { width: 100%; height: 100%; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; z-index: 500;

  display: none; align-items: center; justify-content: center;

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {

/* Toast / loader / confetti */
.toast {
  position: fixed; bottom: 88px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15,16,20,0.94);
  border: 1px solid var(--line-strong);
  padding: 11px 20px; border-radius: 999px;
  font-size: 13px; color: var(--ink);
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: all 280ms cubic-bezier(0.2,0.8,0.2,1);

  opacity: 0; pointer-events: none;

<script>
const FORMATS = {
  landscape: { w: 1920, h: 1080, label: '16:9' },
  a4p:       { w: 1240, h: 1754, label: 'A4 ↕' },
  a4l:       { w: 1754, h: 1240, label: 'A4 ↔' },
  square:    { w: 1600, h: 1600, label: 'Square' },
};
const SAVE_KEY = 'whiteboard-save-v1';

let savedData = null;
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) savedData = JSON.parse(raw); } catch (e) { savedData = null; }

let W = FORMATS.landscape.w, H = FORMATS.landscape.h;
if (savedData && savedData.format && savedData.format.w > 0 && savedData.format.h > 0) {
  W = savedData.format.w; H = savedData.format.h;
}

const PALETTE = [
  '#1a1a1a','#555555','#e94f4f','#f5860d','#f4c430',
  '#22a06b','#2e7dd9','#7c3aed','#db2777','#964b2f',
];
const STICKY_COLORS = ['#fef3a3','#ffd1a3','#f9b5b5','#c8e8b8','#bcdcf7','#e3c8ff'];

const TOOLS = [
  { id:'pen',         key:'P', label:'Pen',            icon:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>' },
  { id:'highlighter', key:'H', label:'Highlighter',    icon:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>' },
  { id:'eraser',      key:'E', label:'Eraser',         icon:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>' },
  { id:'select',      key:'V', label:'Select & move',  icon:'<path d="M5 3l14 7-7 2-2 7-5-16z"/>' },
  { id:'divider' },
  { id:'line',        key:'L', label:'Line',           icon:'<line x1="5" y1="19" x2="19" y2="5"/>' },
  { id:'rect',        key:'R', label:'Rectangle',      icon:'<rect width="16" height="16" x="4" y="4" rx="1"/>' },
  { id:'ellipse',     key:'O', label:'Ellipse',        icon:'<ellipse cx="12" cy="12" rx="9" ry="6"/>' },
  { id:'arrow',       key:'A', label:'Arrow',          icon:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>' },
  { id:'divider' },
  { id:'text',        key:'T', label:'Text',           icon:'<path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/><path d="M12 4v16"/>' },
  { id:'sticky',      key:'S', label:'Sticky note',    icon:'<path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/>' },
  { id:'laser',       key:'X', label:'Laser pointer',  icon:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>' },
];

const SHORTCUTS = [
  ['Pen','P'],['Highlighter','H'],['Eraser','E'],['Select & move','V'],
  ['Line','L'],['Rectangle','R'],['Ellipse','O'],['Arrow','A'],
  ['Text','T'],['Sticky note','S'],['Laser pointer','X'],
  ['Constrain shapes','Shift'],
  ['Undo','⌘ / Ctrl + Z'],['Redo','⌘ / Ctrl + ⇧ + Z'],
  ['Previous page','←'],['Next page','→'],
  ['New page','⌘ / Ctrl + N'],['Export PDF','⌘ / Ctrl + P'],
  ['Focus mode','F'],['Help','?'],
  ['Paste image','⌘ / Ctrl + V'],['Delete selected','⌫'],
  ['Select all','⌘ / Ctrl + A'],['Drag-select multiple','V + drag'],
  ['Collapse/expand sidebar','[ [ ]'],
];

const state = {
  tool: 'pen',
  color: PALETTE[0],
  size: 4,
  pages: [],
  pageIdx: 0,
  drawing: false,
  activeStroke: null,
  shapeStart: null,
  lastShapePt: null,
  mainRedrawScheduled: false,
  laserTrail: [],
  selectedItems: [],
  dragOffset: null,
  marqueeStart: null,
  shiftHeld: false,
  altHeld: false,
  selectedPageIds: new Set(),
};

function makePage() {
  return {
    id: (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36)),
    strokes: [], shapes: [], texts: [], stickies: [], images: [],
    background: 'blank',
    history: [], redoStack: [],
  };
}
if (savedData && Array.isArray(savedData.pages) && savedData.pages.length) {
  state.pages = savedData.pages.map(rp => ({
    id: rp.id || (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36)),
    strokes: rp.strokes || [],
    shapes: rp.shapes || [],
    texts: rp.texts || [],
    stickies: rp.stickies || [],
    images: [],
    background: rp.background || 'blank',
    history: [], redoStack: [],
    _pendingImages: rp.images || [],
  }));
} else {
  state.pages.push(makePage());
}

const bgCanvas      = document.getElementById('bg-canvas');
const mainCanvas    = document.getElementById('main-canvas');
const activeCanvas  = document.getElementById('active-canvas');
const laserCanvas   = document.getElementById('laser-canvas');
const canvasWrap    = document.getElementById('canvas-wrap');
const stickyLayer   = document.getElementById('sticky-layer');
const eraserRing    = document.getElementById('eraser-ring');
const laserCursor   = document.getElementById('laser-cursor');
const selectionLayer = document.getElementById('selection-layer');
const marqueeBox = document.getElementById('marquee-box');

[bgCanvas, mainCanvas, activeCanvas, laserCanvas].forEach(c => { c.width = W; c.height = H; });
const bgCtx     = bgCanvas.getContext('2d');
const mainCtx   = mainCanvas.getContext('2d');
const activeCtx = activeCanvas.getContext('2d');
const laserCtx  = laserCanvas.getContext('2d');

const dockTools = document.getElementById('dock-tools');
TOOLS.forEach(t => {
  if (t.id === 'divider') {
    const d = document.createElement('div'); d.className = 'dock-sep'; dockTools.appendChild(d); return;
  }
  const b = document.createElement('button');
  b.className = 'dock-btn' + (t.id === 'pen' ? ' active' : '');
  b.dataset.tool = t.id;
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
    <div class="tooltip">${t.label}<kbd>${t.key}</kbd></div>`;
  b.addEventListener('click', () => selectTool(t.id));
  dockTools.appendChild(b);
});

const dockColors = document.getElementById('dock-colors');
PALETTE.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'dock-color' + (i === 0 ? ' active' : '');
  s.style.background = c;
  s.dataset.color = c;
  s.title = c;
  s.addEventListener('click', () => selectColor(c, s));
  dockColors.appendChild(s);
});

function selectColor(c, el) {
  state.color = c;
  document.querySelectorAll('.dock-color').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  updateSizeDot();
}

document.getElementById('custom-color').addEventListener('input', e => {
  selectColor(e.target.value, null);
});

function selectTool(id) {
  if (state.selectedItems.length) clearSelection();
  state.tool = id;
  document.querySelectorAll('.dock-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === id));
  canvasWrap.className = 'canvas-wrap';
  const cMap = {
    pen:'tool-pen', highlighter:'tool-highlighter', eraser:'tool-eraser',
    line:'tool-shape', rect:'tool-shape', ellipse:'tool-shape', arrow:'tool-shape',
    text:'tool-text', sticky:'tool-sticky', laser:'tool-laser', select:'tool-select',
  };
  canvasWrap.classList.add(cMap[id] || 'tool-pen');
  eraserRing.style.display = id === 'eraser' ? 'block' : 'none';
  laserCursor.style.display = id === 'laser' ? 'block' : 'none';
  const labels = {
    pen:'Pen', highlighter:'Highlighter', eraser:'Eraser', select:'Selection',
    line:'Line', rect:'Rectangle', ellipse:'Ellipse', arrow:'Arrow',
    text:'Text', sticky:'Sticky note', laser:'Laser',
  };
  const msgs = {
    pen:'· drawing', highlighter:'· highlighting', eraser:'· tap strokes to erase',
    select:'· click and drag to move', line:'· hold ⇧ to snap', rect:'· hold ⇧ for square',
    ellipse:'· hold ⇧ for circle', arrow:'· hold ⇧ to snap',
    text:'· click to type', sticky:'· click to drop a note', laser:'· presentation mode',
  };
  document.getElementById('status-tool').textContent = labels[id] || id;
  document.getElementById('status-msg').textContent = msgs[id] || '';
}

const sizeSlider = document.getElementById('size-slider');
const sizePreviewDot = document.getElementById('size-preview-dot');
const sizePct = document.getElementById('size-pct');
sizeSlider.addEventListener('input', e => { state.size = +e.target.value; updateSizeDot(); });
function updateSizeDot() {
  const px = Math.max(3, Math.min(20, state.size * 0.85));
  sizePreviewDot.style.width = px + 'px';
  sizePreviewDot.style.height = px + 'px';
  sizePreviewDot.style.background = state.color;
  const max = +sizeSlider.max || 40;
  sizePct.textContent = Math.round((state.size / max) * 100) + '%';
}
updateSizeDot();

/* ---- Format / orientation ---- */
const formatPopover = document.getElementById('format-popover');
const formatBtn = document.getElementById('btn-format');
const formatCurrentLabel = document.getElementById('format-current-label');
function positionFormatPopover() {
  const r = formatBtn.getBoundingClientRect();
  const popW = 240;
  let left = r.left + r.width / 2 - popW / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
  formatPopover.style.left = left + 'px';
  formatPopover.style.bottom = 'auto';
  formatPopover.style.top = (r.bottom + 12) + 'px';
}
formatBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const opening = !formatPopover.classList.contains('show');
  if (opening) positionFormatPopover();
  formatPopover.classList.toggle('show', opening);
  formatBtn.classList.toggle('open', opening);
});
window.addEventListener('resize', () => { if (formatPopover.classList.contains('show')) positionFormatPopover(); });
document.addEventListener('click', (e) => {
  if (!formatPopover.contains(e.target) && !formatBtn.contains(e.target)) {
    formatPopover.classList.remove('show');
    formatBtn.classList.remove('open');
  }
});
function markActiveFormat() {
  document.querySelectorAll('#format-options .bg-opt').forEach(o => {
    const f = FORMATS[o.dataset.format];
    const active = !!f && f.w === W && f.h === H;
    o.classList.toggle('active', active);
    if (active && formatCurrentLabel) formatCurrentLabel.textContent = f.label;
  });
}
document.querySelectorAll('#format-options .bg-opt').forEach(o => {
  o.addEventListener('click', (e) => {
    e.stopPropagation();
    const f = FORMATS[o.dataset.format];
    resizeCanvasFormat(f.w, f.h);
    markActiveFormat();
    formatPopover.classList.remove('show');
    formatBtn.classList.remove('open');
    toast(`Format · ${f.label}`);
  });
});
function resizeCanvasFormat(newW, newH) {
  const oldW = W, oldH = H;
  if (newW === oldW && newH === oldH) return;
  const sx = newW / oldW, sy = newH / oldH;
  const savg = (sx + sy) / 2;
  state.pages.forEach(p => {
    p.strokes.forEach(s => s.points.forEach(pt => { pt.x *= sx; pt.y *= sy; if (pt.w) pt.w *= savg; }));
    p.shapes.forEach(sh => { sh.x1 *= sx; sh.x2 *= sx; sh.y1 *= sy; sh.y2 *= sy; sh.width *= savg; });
    p.texts.forEach(t => { t.x *= sx; t.y *= sy; t.size *= savg; });
    p.images.forEach(im => { im.x *= sx; im.y *= sy; im.w *= sx; im.h *= sy; });
  });
  W = newW; H = newH;
  [bgCanvas, mainCanvas, activeCanvas, laserCanvas].forEach(c => { c.width = W; c.height = H; });
  document.querySelector('.canvas-frame').style.aspectRatio = `${W} / ${H}`;
  if (state.selectedItems.length) clearSelection();
  fitFrame();
  renderBackground(); renderMain(); renderStickies(); renderThumbs();
  scheduleSave();
}

  document.getElementById('btn-pdf').classList.toggle('unsaved', hasUnexportedWork);
}
function scheduleSave() {

  updateExportBadge();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}
function saveNow() {

/* ---- Creative chrono clock ---- */
const hrHand = document.getElementById('hr-hand');
const minHand = document.getElementById('min-hand');
const secHand = document.getElementById('sec-hand');
const chronoGreeting = document.getElementById('chrono-greeting');

function greetingFor(hour) {
  if (hour < 5) return 'Burning the midnight oil';
  if (hour < 12) return 'Good morning';
  if (hour < 17) return 'Good afternoon';
  if (hour < 21) return 'Good evening';

}
function tickClock() {
  const now = new Date();
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
  hrHand.style.transform = `rotate(${(h + m / 60) * 30}deg)`;
  minHand.style.transform = `rotate(${(m + s / 60) * 6}deg)`;

  chronoGreeting.textContent = greetingFor(now.getHours());
  chronoDate.textContent = now.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

setInterval(tickClock, 1000);

/* ---- Auto theme by time of day ---- */
function themeClassFor(hour) {
  if (hour < 6 || hour >= 21) return 'theme-night';
  if (hour < 12) return 'theme-morning';
  if (hour < 17) return 'theme-afternoon';
  return 'theme-evening';
}
function applyTimeTheme() {
  const cls = themeClassFor(new Date().getHours());
  document.body.classList.remove('theme-morning', 'theme-afternoon', 'theme-evening', 'theme-night');
  document.body.classList.add(cls);

applyTimeTheme();
setInterval(applyTimeTheme, 60000);

function getCanvasCoords(e) {
  const r = mainCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function canvasToCss(pt) {
  const r = mainCanvas.getBoundingClientRect();
  return { x: pt.x / W * r.width, y: pt.y / H * r.height };
}

function strokePath(ctx, pts) {
  if (pts.length === 0) return;
  if (pts.length === 1) {
    const p = pts[0];
    ctx.beginPath();
    ctx.arc(p.x, p.y, (p.w || 1) / 2, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i-1], b = pts[i];
    const w = (a.w + b.w) / 2;
    ctx.lineWidth = w;
    ctx.beginPath();
    if (i < pts.length - 1) {
      const c = pts[i+1];
      const mx = (b.x + c.x) / 2, my = (b.y + c.y) / 2;
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(b.x, b.y, mx, my);
    } else {
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }
}

function drawStroke(ctx, s) {
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  if (s.type === 'hl') {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.32;
  }
  strokePath(ctx, s.points);
  ctx.restore();
}

function drawShape(ctx, sh) {
  ctx.save();
  ctx.strokeStyle = sh.color;
  ctx.fillStyle = sh.color;
  ctx.lineWidth = sh.width;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const { type, x1, y1, x2, y2 } = sh;
  if (type === 'line') {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  } else if (type === 'rect') {
    const x = Math.min(x1,x2), y = Math.min(y1,y2);
    const w = Math.abs(x2-x1), h = Math.abs(y2-y1);
    const r = Math.min(8, w/8, h/8);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath(); ctx.stroke();
  } else if (type === 'ellipse') {
    const cx = (x1+x2)/2, cy = (y1+y2)/2;
    const rx = Math.abs(x2-x1)/2, ry = Math.abs(y2-y1)/2;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  } else if (type === 'arrow') {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a = Math.atan2(y2-y1, x2-x1);
    const head = Math.max(14, sh.width * 4);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head*Math.cos(a-Math.PI/6), y2 - head*Math.sin(a-Math.PI/6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head*Math.cos(a+Math.PI/6), y2 - head*Math.sin(a+Math.PI/6));
    ctx.stroke();
  }
  ctx.restore();
}

function drawText(ctx, t) {
  ctx.save();
  ctx.fillStyle = t.color;
  ctx.font = `500 ${t.size}px Manrope, system-ui, sans-serif`;
  ctx.textBaseline = 'top';
  const lines = t.text.split('\n');
  lines.forEach((line, i) => ctx.fillText(line, t.x, t.y + i * t.size * 1.2));
  ctx.restore();
}

function drawImage(ctx, im) {
  if (!im.img) return;
  ctx.drawImage(im.img, im.x, im.y, im.w, im.h);
}

function renderMain() {
  mainCtx.clearRect(0, 0, W, H);
  const p = currentPage();
  for (const im of p.images) drawImage(mainCtx, im);
  for (const s of p.strokes) drawStroke(mainCtx, s);
  for (const sh of p.shapes) drawShape(mainCtx, sh);
  for (const t of p.texts) drawText(mainCtx, t);
}

function renderBackground() {
  bgCtx.clearRect(0, 0, W, H);
  const bg = currentPage().background;
  bgCtx.fillStyle = '#fdfbf6';
  bgCtx.fillRect(0, 0, W, H);

  bgCtx.save();
  bgCtx.globalAlpha = 0.025;
  for (let i = 0; i < 700; i++) {
    bgCtx.fillStyle = Math.random() > 0.5 ? '#000' : '#964b2f';
    bgCtx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
  }
  bgCtx.restore();

  if (bg === 'grid') {
    bgCtx.strokeStyle = 'rgba(0,0,0,0.07)'; bgCtx.lineWidth = 1;
    const step = 50;
    for (let x = step; x < W; x += step) { bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,H); bgCtx.stroke(); }
    for (let y = step; y < H; y += step) { bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(W,y); bgCtx.stroke(); }
    bgCtx.strokeStyle = 'rgba(0,0,0,0.11)';
    for (let x = step*5; x < W; x += step*5) { bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,H); bgCtx.stroke(); }
    for (let y = step*5; y < H; y += step*5) { bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(W,y); bgCtx.stroke(); }
  } else if (bg === 'dots') {
    bgCtx.fillStyle = 'rgba(0,0,0,0.22)';
    const step = 36;
    for (let x = step; x < W; x += step) for (let y = step; y < H; y += step) {
      bgCtx.beginPath(); bgCtx.arc(x, y, 1.2, 0, Math.PI*2); bgCtx.fill();
    }
  } else if (bg === 'lines') {
    bgCtx.strokeStyle = 'rgba(0,0,0,0.10)'; bgCtx.lineWidth = 1;
    const step = 48;
    for (let y = step; y < H; y += step) { bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(W,y); bgCtx.stroke(); }
    bgCtx.strokeStyle = 'rgba(194,88,91,0.20)';
    bgCtx.beginPath(); bgCtx.moveTo(120, 0); bgCtx.lineTo(120, H); bgCtx.stroke();
  }
}

const currentPage = () => state.pages[state.pageIdx];

let lastPointTime = 0, lastPointXY = null;
function widthAt(e, pt, baseWidth, isHighlighter) {
  if (isHighlighter) return baseWidth;
  const now = performance.now();
  let mult = 1;
  const isStylus = e.pointerType === 'pen' || (typeof e.pressure === 'number' && e.pressure > 0 && e.pressure !== 0.5);
  if (isStylus && e.pressure > 0 && e.pressure < 1) {
    mult = 0.45 + e.pressure * 0.85;
  } else if (lastPointXY) {
    const dt = Math.max(1, now - lastPointTime);
    const dist = Math.hypot(pt.x - lastPointXY.x, pt.y - lastPointXY.y);
    const speed = dist / dt;
    const sp = Math.min(3, speed);
    mult = 1.2 - sp * 0.22;
  }
  return Math.max(baseWidth * 0.45, Math.min(baseWidth * 1.4, baseWidth * mult));
}

mainCanvas.addEventListener('pointerdown', onDown);
mainCanvas.addEventListener('pointermove', onMove);
mainCanvas.addEventListener('pointerup', onUp);
mainCanvas.addEventListener('pointercancel', onUp);
mainCanvas.addEventListener('pointerleave', e => {
  if (state.drawing && state.tool !== 'laser') onUp(e);
  eraserRing.style.display = (state.tool === 'eraser') ? 'block' : 'none';
});
mainCanvas.addEventListener('contextmenu', e => e.preventDefault());

function onDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  mainCanvas.setPointerCapture && mainCanvas.setPointerCapture(e.pointerId);
  const pt = getCanvasCoords(e);
  lastPointXY = pt; lastPointTime = performance.now();
  const tool = state.tool;

  if (tool === 'pen' || tool === 'highlighter') {
    state.drawing = true;
    const baseW = tool === 'highlighter' ? state.size * 4 : state.size;
    state.activeStroke = {
      type: tool === 'highlighter' ? 'hl' : 'pen',
      points: [{ x: pt.x, y: pt.y, w: widthAt(e, pt, baseW, tool === 'highlighter') }],
      color: state.color,
      baseWidth: baseW,
    };
    drawStrokeIncremental(activeCtx, state.activeStroke, true);
  }
  else if (tool === 'eraser') {
    state.drawing = true;
    eraseAt(pt);
  }
  else if (['line','rect','ellipse','arrow'].includes(tool)) {
    state.drawing = true;
    state.shapeStart = pt;
  }
  else if (tool === 'text') {
    placeTextEditor(pt);
  }
  else if (tool === 'sticky') {
    placeSticky(pt);
  }
  else if (tool === 'laser') {
    state.drawing = true;
    state.laserTrail = [{ x: pt.x, y: pt.y, t: performance.now() }];
  }
  else if (tool === 'select') {
    const hit = hitTest(pt);
    if (hit) {
      const already = state.selectedItems.some(it => it.kind === hit.kind && it.index === hit.index);
      if (!already) state.selectedItems = [hit];
      state.dragOffset = { x: pt.x, y: pt.y };
      canvasWrap.classList.add('grabbing');
      state.drawing = true;
      renderSelection();
    } else {
      state.selectedItems = [];
      state.marqueeStart = pt;
      state.drawing = true;
      renderSelection();
    }
  }
}

function onMove(e) {
  const pt = getCanvasCoords(e);

  if (state.tool === 'eraser') {
    const cssPt = canvasToCss(pt);
    eraserRing.style.left = cssPt.x + 'px';
    eraserRing.style.top = cssPt.y + 'px';
    const rad = (state.size * 4 + 10);
    const cssRad = rad / W * mainCanvas.getBoundingClientRect().width;
    eraserRing.style.width = (cssRad * 2) + 'px';
    eraserRing.style.height = (cssRad * 2) + 'px';
    eraserRing.style.display = 'block';
  }

  if (state.tool === 'laser') {
    const cssPt = canvasToCss(pt);
    laserCursor.style.left = cssPt.x + 'px';
    laserCursor.style.top = cssPt.y + 'px';
    if (state.drawing) {
      state.laserTrail.push({ x: pt.x, y: pt.y, t: performance.now() });
    }
    return;
  }

  if (!state.drawing) return;
  const tool = state.tool;

  if (tool === 'pen' || tool === 'highlighter') {
    const s = state.activeStroke;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of events) {
      const cpt = getCanvasCoords(ev);
      const last = s.points[s.points.length - 1];
      const d = Math.hypot(cpt.x - last.x, cpt.y - last.y);
      if (d < 1.4) continue;
      const w = widthAt(ev, cpt, s.baseWidth, tool === 'highlighter');
      s.points.push({ x: cpt.x, y: cpt.y, w });
      lastPointXY = cpt; lastPointTime = performance.now();
    }
    scheduleActiveDraw();
  }
  else if (tool === 'eraser') {
    eraseAt(pt);
  }
  else if (['line','rect','ellipse','arrow'].includes(tool)) {
    state.lastShapePt = pt;
    scheduleActiveDraw();
  }
  else if (tool === 'select' && state.marqueeStart) {
    const a = state.marqueeStart, b = pt;
    const mx = Math.min(a.x, b.x), my = Math.min(a.y, b.y);
    const mw = Math.abs(b.x - a.x), mh = Math.abs(b.y - a.y);
    const cssA = canvasToCss({ x: mx, y: my });
    const cssB = canvasToCss({ x: mx + mw, y: my + mh });
    marqueeBox.style.display = 'block';
    marqueeBox.style.left = cssA.x + 'px'; marqueeBox.style.top = cssA.y + 'px';
    marqueeBox.style.width = (cssB.x - cssA.x) + 'px'; marqueeBox.style.height = (cssB.y - cssA.y) + 'px';
    state.selectedItems = itemsInRect({ x: mx, y: my, w: mw, h: mh });
    renderSelection();
  }
  else if (tool === 'select' && state.selectedItems.length && state.dragOffset) {
    const dx = pt.x - state.dragOffset.x, dy = pt.y - state.dragOffset.y;
    moveSelectedGroup(dx, dy);
    state.dragOffset = { x: pt.x, y: pt.y };
    renderSelection();
    if (!state.mainRedrawScheduled) {
      state.mainRedrawScheduled = true;
      requestAnimationFrame(() => { state.mainRedrawScheduled = false; renderMain(); renderStickies(); });
    }
  }
}

let activeRafScheduled = false;
function scheduleActiveDraw() {
  if (activeRafScheduled) return;
  activeRafScheduled = true;
  requestAnimationFrame(() => {
    activeRafScheduled = false;
    if (state.activeStroke) {
      drawStrokeIncremental(activeCtx, state.activeStroke, false);
    } else if (state.shapeStart && state.lastShapePt && ['line','rect','ellipse','arrow'].includes(state.tool)) {
      activeCtx.clearRect(0, 0, W, H);
      let p2 = state.lastShapePt;
      if (state.shiftHeld) p2 = constrainShape(state.tool, state.shapeStart, p2);
      let start = state.shapeStart;
      if (state.altHeld) {
        const dx = p2.x - state.shapeStart.x, dy = p2.y - state.shapeStart.y;
        start = { x: state.shapeStart.x - dx, y: state.shapeStart.y - dy };
      }
      drawShape(activeCtx, {
        type: state.tool, x1: start.x, y1: start.y, x2: p2.x, y2: p2.y,
        color: state.color, width: state.size,
      });
    }
  });
}

function onUp(e) {
  if (!state.drawing && state.tool !== 'laser') return;
  state.drawing = false;
  const pt = getCanvasCoords(e);
  const tool = state.tool;
  const p = currentPage();
  p.redoStack = [];

  if (tool === 'pen' || tool === 'highlighter') {
    if (state.activeStroke && state.activeStroke.points.length > 0) {
      p.strokes.push(state.activeStroke);
      p.history.push({ kind:'add', target:'stroke', item: state.activeStroke });
    }
    state.activeStroke = null;
  }
  else if (['line','rect','ellipse','arrow'].includes(tool) && state.shapeStart) {
    let p2 = pt;
    if (state.shiftHeld) p2 = constrainShape(tool, state.shapeStart, pt);
    let start = state.shapeStart;
    if (state.altHeld) {
      const dx = p2.x - state.shapeStart.x, dy = p2.y - state.shapeStart.y;
      start = { x: state.shapeStart.x - dx, y: state.shapeStart.y - dy };
    }
    if (Math.hypot(p2.x - start.x, p2.y - start.y) > 4) {
      const shape = {
        type: tool,
        x1: start.x, y1: start.y, x2: p2.x, y2: p2.y,
        color: state.color, width: state.size,
      };
      p.shapes.push(shape);
      p.history.push({ kind:'add', target:'shape', item: shape });
    }
    state.shapeStart = null;
    state.lastShapePt = null;
  }
  else if (tool === 'select') {
    canvasWrap.classList.remove('grabbing');
    state.dragOffset = null;
    if (state.marqueeStart) {
      state.marqueeStart = null;
      marqueeBox.style.display = 'none';
      if (state.selectedItems.length) toast(`${state.selectedItems.length} selected`);
    }
  }

  activeCtx.clearRect(0, 0, W, H);
  renderMain();
  redrawCurrentThumb();
}

function drawStrokeIncremental(ctx, s, isFirst) {
  if (isFirst) ctx.clearRect(0, 0, W, H);
  if (s.points.length < 2) {
    drawStroke(ctx, s); return;
  }
  ctx.clearRect(0, 0, W, H);
  drawStroke(ctx, s);
}

function constrainShape(tool, p1, p2) {
  if (tool === 'line' || tool === 'arrow') {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    const snap = Math.PI / 12;
    const angSnapped = Math.round(ang / snap) * snap;
    return { x: p1.x + len * Math.cos(angSnapped), y: p1.y + len * Math.sin(angSnapped) };
  } else {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const m = Math.max(Math.abs(dx), Math.abs(dy));
    return { x: p1.x + (dx >= 0 ? m : -m), y: p1.y + (dy >= 0 ? m : -m) };
  }
}

function distToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx*dx + dy*dy;
  if (L2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
}
function eraseAt(pt) {
  const p = currentPage();
  const radius = state.size * 4 + 10;
  const removed = [];

  p.strokes = p.strokes.filter(s => {
    const pts = s.points;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[Math.min(i+1, pts.length-1)];
      if (distToSeg(pt, a, b) < radius + (s.points[0].w || 1)/2) { removed.push({ kind:'remove', target:'stroke', item:s }); return false; }
    }
    return true;
  });
  p.shapes = p.shapes.filter(sh => {
    const samples = sampleShape(sh, 24);
    for (let i = 0; i < samples.length - 1; i++) {
      if (distToSeg(pt, samples[i], samples[i+1]) < radius) { removed.push({ kind:'remove', target:'shape', item:sh }); return false; }
    }
    return true;
  });
  p.texts = p.texts.filter(t => {
    const bb = textBBox(t);
    if (pt.x > bb.x - radius && pt.x < bb.x + bb.w + radius && pt.y > bb.y - radius && pt.y < bb.y + bb.h + radius) {
      removed.push({ kind:'remove', target:'text', item:t }); return false;
    }
    return true;
  });
  p.images = p.images.filter(im => {
    if (pt.x > im.x && pt.x < im.x + im.w && pt.y > im.y && pt.y < im.y + im.h) {
      removed.push({ kind:'remove', target:'image', item:im }); return false;
    }
    return true;
  });

  if (removed.length) {
    p.history.push({ kind:'eraseGroup', items: removed });
    renderMain();
  }
}
function sampleShape(sh, n) {
  const pts = [];
  if (sh.type === 'line' || sh.type === 'arrow') {
    for (let i = 0; i <= n; i++) {
      const t = i/n;
      pts.push({ x: sh.x1 + (sh.x2-sh.x1)*t, y: sh.y1 + (sh.y2-sh.y1)*t });
    }
  } else if (sh.type === 'rect') {
    const x = Math.min(sh.x1,sh.x2), y = Math.min(sh.y1,sh.y2);
    const w = Math.abs(sh.x2-sh.x1), h = Math.abs(sh.y2-sh.y1);
    for (let i = 0; i <= n; i++) { const t = i/n;
      pts.push({ x: x + w*t, y });
      pts.push({ x: x + w, y: y + h*t });
      pts.push({ x: x + w*(1-t), y: y + h });
      pts.push({ x, y: y + h*(1-t) });
    }
  } else if (sh.type === 'ellipse') {
    const cx = (sh.x1+sh.x2)/2, cy = (sh.y1+sh.y2)/2;
    const rx = Math.abs(sh.x2-sh.x1)/2, ry = Math.abs(sh.y2-sh.y1)/2;
    for (let i = 0; i <= n; i++) {
      const a = (i/n) * Math.PI * 2;
      pts.push({ x: cx + Math.cos(a)*rx, y: cy + Math.sin(a)*ry });
    }
  }
  return pts;
}

function textBBox(t) {
  const lines = t.text.split('\n');
  const longest = lines.reduce((m, l) => Math.max(m, l.length), 1);
  return { x: t.x, y: t.y, w: longest * t.size * 0.55, h: lines.length * t.size * 1.2 };
}

function strokeBBox(s) {
  let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity;
  for (const p of s.points) {
    xMin = Math.min(xMin, p.x); yMin = Math.min(yMin, p.y);
    xMax = Math.max(xMax, p.x); yMax = Math.max(yMax, p.y);
  }
  const pad = (s.baseWidth || s.points[0]?.w || 4) / 2;
  return { x: xMin - pad, y: yMin - pad, w: xMax - xMin + pad*2, h: yMax - yMin + pad*2 };
}
function shapeBBox(sh) {
  const x = Math.min(sh.x1, sh.x2), y = Math.min(sh.y1, sh.y2);
  const w = Math.abs(sh.x2 - sh.x1), h = Math.abs(sh.y2 - sh.y1);
  const pad = sh.width / 2 + 4;
  return { x: x - pad, y: y - pad, w: w + pad*2, h: h + pad*2 };
}
function imageBBox(im) { return { x: im.x, y: im.y, w: im.w, h: im.h }; }
function stickyBBox(s) {
  const cx = s.x * W, cy = s.y * H, hw = 100, hh = 70;
  return { x: cx - hw, y: cy - hh, w: hw * 2, h: hh * 2 };
}

function hitTest(pt) {
  const p = currentPage();
  for (let i = p.texts.length - 1; i >= 0; i--) {
    const bb = textBBox(p.texts[i]);
    if (pt.x >= bb.x && pt.x <= bb.x + bb.w && pt.y >= bb.y && pt.y <= bb.y + bb.h) {
      return { kind:'text', index:i, bbox: bb };
    }
  }
  for (let i = p.shapes.length - 1; i >= 0; i--) {
    const samples = sampleShape(p.shapes[i], 24);
    for (let j = 0; j < samples.length - 1; j++) {
      if (distToSeg(pt, samples[j], samples[j+1]) < 12) return { kind:'shape', index:i, bbox: shapeBBox(p.shapes[i]) };
    }
  }
  for (let i = p.strokes.length - 1; i >= 0; i--) {
    const s = p.strokes[i];
    for (let j = 0; j < s.points.length - 1; j++) {
      if (distToSeg(pt, s.points[j], s.points[j+1]) < 10 + (s.points[j].w||1)/2) {
        return { kind:'stroke', index:i, bbox: strokeBBox(s) };
      }
    }
  }
  for (let i = p.images.length - 1; i >= 0; i--) {
    const bb = imageBBox(p.images[i]);
    if (pt.x >= bb.x && pt.x <= bb.x + bb.w && pt.y >= bb.y && pt.y <= bb.y + bb.h) {
      return { kind:'image', index:i, bbox: bb };
    }
  }
  return null;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function itemsInRect(rect) {
  const p = currentPage();
  const items = [];
  p.strokes.forEach((s, i) => { const bb = strokeBBox(s); if (rectsOverlap(bb, rect)) items.push({ kind: 'stroke', index: i, bbox: bb }); });
  p.shapes.forEach((s, i) => { const bb = shapeBBox(s); if (rectsOverlap(bb, rect)) items.push({ kind: 'shape', index: i, bbox: bb }); });
  p.texts.forEach((t, i) => { const bb = textBBox(t); if (rectsOverlap(bb, rect)) items.push({ kind: 'text', index: i, bbox: bb }); });
  p.images.forEach((im, i) => { const bb = imageBBox(im); if (rectsOverlap(bb, rect)) items.push({ kind: 'image', index: i, bbox: bb }); });
  p.stickies.forEach((s, i) => { const bb = stickyBBox(s); if (rectsOverlap(bb, rect)) items.push({ kind: 'sticky', index: i, bbox: bb }); });
  return items;
}
function selectAll() {
  const p = currentPage();
  const items = [];
  p.strokes.forEach((s, i) => items.push({ kind: 'stroke', index: i, bbox: strokeBBox(s) }));
  p.shapes.forEach((s, i) => items.push({ kind: 'shape', index: i, bbox: shapeBBox(s) }));
  p.texts.forEach((t, i) => items.push({ kind: 'text', index: i, bbox: textBBox(t) }));
  p.images.forEach((im, i) => items.push({ kind: 'image', index: i, bbox: imageBBox(im) }));
  p.stickies.forEach((s, i) => items.push({ kind: 'sticky', index: i, bbox: stickyBBox(s) }));
  state.selectedItems = items;
  renderSelection();
  if (items.length) toast(`${items.length} selected`);
}
function clearSelection() {
  state.selectedItems = [];
  renderSelection();
}
function renderSelection() {
  selectionLayer.innerHTML = '';
  if (!state.selectedItems.length) return;
  let gxMin = Infinity, gyMin = Infinity, gxMax = -Infinity, gyMax = -Infinity;
  state.selectedItems.forEach(it => {
    const css = canvasToCss({ x: it.bbox.x, y: it.bbox.y });
    const css2 = canvasToCss({ x: it.bbox.x + it.bbox.w, y: it.bbox.y + it.bbox.h });
    const box = document.createElement('div');
    box.className = 'sel-box';
    box.style.left = css.x + 'px'; box.style.top = css.y + 'px';
    box.style.width = (css2.x - css.x) + 'px'; box.style.height = (css2.y - css.y) + 'px';
    selectionLayer.appendChild(box);
    gxMin = Math.min(gxMin, it.bbox.x); gyMin = Math.min(gyMin, it.bbox.y);
    gxMax = Math.max(gxMax, it.bbox.x + it.bbox.w); gyMax = Math.max(gyMax, it.bbox.y + it.bbox.h);
  });
  const lbl = document.createElement('div');
  lbl.className = 'sel-label';
  const gcss = canvasToCss({ x: gxMin, y: gyMin });
  lbl.style.left = gcss.x + 'px';
  lbl.style.top = (gcss.y - 22) + 'px';
  lbl.textContent = state.selectedItems.length === 1
    ? 'Selected · drag to move · ⌫ delete'
    : `${state.selectedItems.length} selected · drag to move · ⌫ delete`;

}
function moveSelectedGroup(dx, dy) {
  const p = currentPage();
  let stickiesMoved = false;
  state.selectedItems.forEach(it => {
    if (it.kind === 'stroke') {
      p.strokes[it.index].points.forEach(pt => { pt.x += dx; pt.y += dy; });
    } else if (it.kind === 'shape') {
      const sh = p.shapes[it.index];
      sh.x1 += dx; sh.x2 += dx; sh.y1 += dy; sh.y2 += dy;
    } else if (it.kind === 'text') {
      const t = p.texts[it.index]; t.x += dx; t.y += dy;
    } else if (it.kind === 'image') {
      const im = p.images[it.index]; im.x += dx; im.y += dy;
    } else if (it.kind === 'sticky') {
      const s = p.stickies[it.index]; s.x += dx / W; s.y += dy / H;
      stickiesMoved = true;
    }
    it.bbox.x += dx; it.bbox.y += dy;
  });
  if (stickiesMoved) renderStickies();
}
function deleteSelected() {
  if (!state.selectedItems.length) return;
  const p = currentPage();
  const byKind = {};
  state.selectedItems.forEach(it => { (byKind[it.kind] = byKind[it.kind] || []).push(it.index); });
  const removedGroup = [];
  Object.keys(byKind).forEach(kind => {
    const arr = arrFor(p, kind);
    byKind[kind].sort((a, b) => b - a).forEach(idx => {
      const item = arr.splice(idx, 1)[0];
      if (item) removedGroup.push({ target: kind, item });
    });
  });
  if (removedGroup.length) p.history.push({ kind: 'eraseGroup', items: removedGroup });
  p.redoStack = [];
  const count = state.selectedItems.length;
  clearSelection();
  renderMain();
  renderStickies();
  redrawCurrentThumb();
  toast(count > 1 ? `${count} items deleted` : 'Deleted');
}

function fitFrame() {
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.canvas-frame');
  if (!stage || !frame) return;
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const ratio = W / H;
  let w = availW;
  let h = w / ratio;
  if (h > availH) { h = availH; w = h * ratio; }
  frame.style.width  = Math.max(0, Math.floor(w)) + 'px';
  frame.style.height = Math.max(0, Math.floor(h)) + 'px';
}

function laserLoop() {
  laserCtx.clearRect(0, 0, W, H);
  const now = performance.now();
  state.laserTrail = state.laserTrail.filter(p => now - p.t < 1100);
  if (state.laserTrail.length > 0) {
    for (let i = 1; i < state.laserTrail.length; i++) {
      const a = state.laserTrail[i-1], b = state.laserTrail[i];
      const age = (now - b.t) / 1100;
      const alpha = (1 - age) * 0.55;
      laserCtx.strokeStyle = `rgba(255,40,60,${alpha})`;
      laserCtx.lineWidth = 6 * (1 - age) + 2;
      laserCtx.lineCap = 'round';
      laserCtx.beginPath(); laserCtx.moveTo(a.x, a.y); laserCtx.lineTo(b.x, b.y); laserCtx.stroke();
    }
    const tip = state.laserTrail[state.laserTrail.length - 1];
    const g = laserCtx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 30);
    g.addColorStop(0, 'rgba(255,80,90,0.9)');
    g.addColorStop(0.4, 'rgba(255,40,60,0.45)');
    g.addColorStop(1, 'rgba(255,40,60,0)');
    laserCtx.fillStyle = g;
    laserCtx.fillRect(tip.x-30, tip.y-30, 60, 60);
  }
  requestAnimationFrame(laserLoop);
}
laserLoop();

let activeEditor = null;
function placeTextEditor(pt) {
  if (activeEditor) commitTextEditor();
  const rect = mainCanvas.getBoundingClientRect();
  const sx = rect.width / W, sy = rect.height / H;
  const internalSize = Math.max(28, state.size * 8);
  const cssSize = internalSize * sx;

  const ed = document.createElement('textarea');
  ed.className = 'text-editor';
  ed.style.left = (pt.x * sx) + 'px';
  ed.style.top  = (pt.y * sy) + 'px';
  ed.style.color = state.color;
  ed.style.fontSize = cssSize + 'px';
  ed.style.fontFamily = 'Manrope, system-ui, sans-serif';
  ed.style.lineHeight = '1.2';
  ed.rows = 1;
  ed.dataset.x = pt.x;
  ed.dataset.y = pt.y;
  ed.dataset.size = internalSize;
  ed.dataset.color = state.color;
  canvasWrap.appendChild(ed);
  setTimeout(() => ed.focus(), 0);
  activeEditor = ed;
  ed.addEventListener('blur', commitTextEditor);
  ed.addEventListener('keydown', e => {
    if (e.key === 'Escape') commitTextEditor();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) commitTextEditor();
  });
  ed.addEventListener('input', () => {
    ed.style.height = 'auto';
    ed.style.height = ed.scrollHeight + 'px';
    ed.style.width  = 'auto';
    ed.style.width  = Math.max(80, ed.scrollWidth + 4) + 'px';

}
function commitTextEditor() {
  if (!activeEditor) return;
  const ed = activeEditor; activeEditor = null;
  const text = ed.value.trim();
  if (text) {
    const p = currentPage();
    const t = { x:+ed.dataset.x, y:+ed.dataset.y, text, color:ed.dataset.color, size:+ed.dataset.size };
    p.texts.push(t);
    p.history.push({ kind:'add', target:'text', item:t });
    p.redoStack = [];
    renderMain();
    redrawCurrentThumb();
  }

}

function placeSticky(pt) {

    x: pt.x / W, y: pt.y / H,

function renderStickies() {

    const close = document.createElement('button');
    close.className = 'sticky-close';
    close.textContent = '×';
    close.addEventListener('click', () => {

      const removed = p.stickies.splice(idx, 1)[0];

document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const it of items) {
    if (it.type.startsWith('image/')) {
      const file = it.getAsFile();
      if (!file) continue;
      const r = new FileReader();
      r.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const p = currentPage();
          const maxW = W * 0.45, maxH = H * 0.6;
          let w = img.width, h = img.height;
          const r1 = Math.min(maxW / w, maxH / h, 1);
          w *= r1; h *= r1;
          const x = (W - w) / 2, y = (H - h) / 2;
          const im = { img, x, y, w, h };
          p.images.push(im);
          p.history.push({ kind:'add', target:'image', item: im });
          p.redoStack = [];
          renderMain(); redrawCurrentThumb();
          toast('Image pasted');
        };
        img.src = ev.target.result;
      };
      r.readAsDataURL(file);
    }
  }
});

canvasWrap.addEventListener('dragover', e => { e.preventDefault(); });
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer?.files?.[0];
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const pt = getCanvasCoords(e);
      const p = currentPage();
      const maxW = W * 0.45, maxH = H * 0.6;
      let w = img.width, h = img.height;
      const r1 = Math.min(maxW / w, maxH / h, 1);
      w *= r1; h *= r1;
      const im = { img, x: pt.x - w/2, y: pt.y - h/2, w, h };
      p.images.push(im);
      p.history.push({ kind:'add', target:'image', item: im });
      p.redoStack = [];
      renderMain(); redrawCurrentThumb();
      toast('Image added');
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
});

function undo() {
  const p = currentPage();
  const op = p.history.pop();
  if (!op) return;
  if (op.kind === 'add') {
    const arr = arrFor(p, op.target);
    const idx = arr.indexOf(op.item);
    if (idx >= 0) arr.splice(idx, 1);
  } else if (op.kind === 'remove') {
    arrFor(p, op.target).push(op.item);
  } else if (op.kind === 'eraseGroup') {
    for (const x of op.items) arrFor(p, x.target).push(x.item);
  }
  p.redoStack.push(op);
  renderMain(); renderStickies(); redrawCurrentThumb();
  if (state.selectedItems.length) clearSelection();
}
function redo() {
  const p = currentPage();
  const op = p.redoStack.pop();
  if (!op) return;
  if (op.kind === 'add') arrFor(p, op.target).push(op.item);
  else if (op.kind === 'remove') {
    const arr = arrFor(p, op.target);
    const idx = arr.indexOf(op.item);
    if (idx >= 0) arr.splice(idx, 1);
  } else if (op.kind === 'eraseGroup') {
    for (const x of op.items) {
      const arr = arrFor(p, x.target);
      const idx = arr.indexOf(x.item);
      if (idx >= 0) arr.splice(idx, 1);
    }
  }
  p.history.push(op);
  renderMain(); renderStickies(); redrawCurrentThumb();
}
function arrFor(p, target) {
  return { stroke: p.strokes, shape: p.shapes, text: p.texts, sticky: p.stickies, image: p.images }[target];
}

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);
