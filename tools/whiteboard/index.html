  clearMenu.classList.remove('show');
  if (!confirm('Clear this page? Use Undo to restore.')) return;
  const p = currentPage();
  p.history.push({
    kind: 'eraseGroup',
    items: [
      ...p.strokes.map(s => ({ target:'stroke', item:s })),
      ...p.shapes.map(s => ({ target:'shape', item:s })),
      ...p.texts.map(t => ({ target:'text', item:t })),
      ...p.stickies.map(s => ({ target:'sticky', item:s })),
      ...p.images.map(i => ({ target:'image', item:i })),
    ]
  });
  p.strokes = []; p.shapes = []; p.texts = []; p.stickies = []; p.images = [];
  p.redoStack = [];
  renderMain(); renderStickies(); redrawCurrentThumb();
  toast('Page cleared');
});

document.getElementById('clear-selected').addEventListener('click', () => {
  clearMenu.classList.remove('show');
  const ids = state.selectedPageIds;
  if (!ids.size) return;
  if (ids.size >= state.pages.length) { toast('At least one page must remain'); return; }
  if (!confirm(`Delete ${ids.size} selected page${ids.size > 1 ? 's' : ''}? This cannot be undone.`)) return;
  state.pages = state.pages.filter(p => !ids.has(p.id));
  ids.clear();
  if (state.pageIdx >= state.pages.length) state.pageIdx = state.pages.length - 1;
  gotoPage(state.pageIdx);
  renderThumbs();
  toast('Selected pages deleted');
});

document.getElementById('clear-all').addEventListener('click', () => {
  clearMenu.classList.remove('show');
  if (!confirm(`Delete all ${state.pages.length} pages? This resets to a single blank page and cannot be undone.`)) return;
  state.pages = [makePage()];
  state.selectedPageIds.clear();
  state.pageIdx = 0;
  gotoPage(0);
  renderThumbs();
  toast('All pages deleted');
});

function gotoPage(idx) {
  if (idx < 0 || idx >= state.pages.length) return;
  if (activeEditor) commitTextEditor();
  if (state.selectedItems.length) clearSelection();
  state.pageIdx = idx;
  renderBackground(); renderMain(); renderStickies();
  document.getElementById('page-cur').textContent = idx + 1;
  document.getElementById('page-tot').textContent = state.pages.length;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === state.pages.length - 1;
  document.querySelectorAll('.bg-opt').forEach(o => o.classList.toggle('active', o.dataset.bg === currentPage().background));
  updateActiveThumb();
}
function addPage() {
  state.pages.splice(state.pageIdx + 1, 0, makePage());
  gotoPage(state.pageIdx + 1);
  renderThumbs();
  toast(`Added page ${state.pageIdx + 1}`);
}
function deletePage(idx) {
  if (state.pages.length <= 1) { toast('At least one page required'); return; }
  if (!confirm(`Delete page ${idx + 1}?`)) return;
  const removed = state.pages.splice(idx, 1)[0];
  state.selectedPageIds.delete(removed.id);
  if (state.pageIdx >= state.pages.length) state.pageIdx = state.pages.length - 1;
  gotoPage(state.pageIdx);
  renderThumbs();
  toast('Page deleted');
}

document.getElementById('btn-prev').addEventListener('click', () => gotoPage(state.pageIdx - 1));
document.getElementById('btn-next').addEventListener('click', () => gotoPage(state.pageIdx + 1));
document.getElementById('btn-add-page').addEventListener('click', addPage);

/* ---- Page thumbnails ----
   renderThumbs() rebuilds the whole thumbnail list and redraws every page's
   canvas — expensive, so it's only called when the page LIST itself changes
   (added/deleted/resized), not on every edit.
   redrawCurrentThumb() redraws just the current page's own thumbnail canvas,
   deferred to the next animation frame so it never runs synchronously inside
   a pointerup/input handler (that synchronous blocking was the root cause of
   both the slowdown with many pages and the pen input feeling "stuck" —
   heavy work on the main thread delays processing of the next pointer
   events, which is far more noticeable with a pen's high-frequency input
   than with a mouse).
   updateActiveThumb() just toggles which thumb has the "active" highlight —
   used when only navigating between pages, where no page content changed at
   all, so no canvas needs to be redrawn. */
function renderThumbs() {
  scheduleSave();
  const c = document.getElementById('thumbs');
  c.innerHTML = '';
  state.pages.forEach((p, i) => {
    const w = document.createElement('div');
    w.className = 'thumb'
      + (i === state.pageIdx ? ' active' : '')
      + (state.selectedPageIds.has(p.id) ? ' selected' : '');
    w.title = `Page ${i+1}`;
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 72;
    w.appendChild(cv);
    const num = document.createElement('div');
    num.className = 'thumb-num'; num.textContent = String(i+1).padStart(2,'0');
    w.appendChild(num);
    const chk = document.createElement('button');
    chk.className = 'thumb-check' + (state.selectedPageIds.has(p.id) ? ' checked' : '');
    chk.title = 'Select for bulk delete';
    chk.addEventListener('click', e => {
      e.stopPropagation();
      if (state.selectedPageIds.has(p.id)) state.selectedPageIds.delete(p.id);
      else state.selectedPageIds.add(p.id);
      chk.classList.toggle('checked');
      w.classList.toggle('selected', state.selectedPageIds.has(p.id));
      updateClearMenuState();
    });
    w.appendChild(chk);
    if (state.pages.length > 1) {
      const d = document.createElement('button');
      d.className = 'thumb-del'; d.innerHTML = '×'; d.title = 'Delete';
      d.addEventListener('click', e => { e.stopPropagation(); deletePage(i); });
      w.appendChild(d);
    }
    w.addEventListener('click', () => gotoPage(i));
    c.appendChild(w);
    drawThumb(cv, p);
  });
}
function updateActiveThumb() {
  const c = document.getElementById('thumbs');
  Array.from(c.children).forEach((el, i) => el.classList.toggle('active', i === state.pageIdx));
}
let thumbRedrawScheduled = false;
function redrawCurrentThumb() {
  scheduleSave();
  if (thumbRedrawScheduled) return;
  thumbRedrawScheduled = true;
  requestAnimationFrame(() => {
    thumbRedrawScheduled = false;
    const c = document.getElementById('thumbs');
    const el = c.children[state.pageIdx];
    if (!el) { renderThumbs(); return; }
    const cv = el.querySelector('canvas');
    if (cv) drawThumb(cv, currentPage());
  });
}
function drawThumb(c, p) {
  const ctx = c.getContext('2d');
  const sx = c.width / W, sy = c.height / H;
  ctx.fillStyle = '#fdfbf6'; ctx.fillRect(0, 0, c.width, c.height);
  if (p.background === 'grid') {
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 0.5;
    for (let x = 0; x < c.width; x += 6) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke(); }
    for (let y = 0; y < c.height; y += 6) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke(); }
  } else if (p.background === 'dots') {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    for (let x = 4; x < c.width; x += 6) for (let y = 4; y < c.height; y += 6) {
      ctx.beginPath(); ctx.arc(x, y, 0.5, 0, Math.PI*2); ctx.fill();
    }
  } else if (p.background === 'lines') {
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 0.5;
    for (let y = 0; y < c.height; y += 5) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke(); }
  }
  for (const im of p.images) {
    try { ctx.drawImage(im.img, im.x*sx, im.y*sy, im.w*sx, im.h*sy); } catch(e) {}
  }
  for (const s of p.strokes) {
    ctx.save();
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.type === 'hl') { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.3; }
    const pts = s.points;
    if (pts.length === 1) {
      ctx.beginPath(); ctx.arc(pts[0].x*sx, pts[0].y*sy, Math.max(0.4, (pts[0].w||1)*sx*0.5), 0, Math.PI*2); ctx.fill();
    } else {
      for (let i = 1; i < pts.length; i++) {
        ctx.lineWidth = Math.max(0.4, ((pts[i-1].w + pts[i].w)/2) * sx);
        ctx.beginPath(); ctx.moveTo(pts[i-1].x*sx, pts[i-1].y*sy); ctx.lineTo(pts[i].x*sx, pts[i].y*sy); ctx.stroke();
      }
    }
    ctx.restore();
  }
  for (const sh of p.shapes) drawShape(ctx, { ...sh, x1:sh.x1*sx, y1:sh.y1*sy, x2:sh.x2*sx, y2:sh.y2*sy, width: Math.max(0.5, sh.width * sx) });
  for (const t of p.texts) {
    ctx.save(); ctx.fillStyle = t.color; ctx.font = `${t.size*sx}px Manrope, sans-serif`; ctx.textBaseline = 'top';
    ctx.fillText(t.text.split('\n')[0], t.x*sx, t.y*sy); ctx.restore();
  }
  for (const sn of p.stickies) {
    ctx.save();
    ctx.translate(sn.x*c.width, sn.y*c.height);
    ctx.rotate(sn.rotation * Math.PI/180);
    ctx.fillStyle = sn.color; ctx.fillRect(0, 0, 14, 10);
    ctx.restore();
  }
}

let jsPDFLoaded = null;
function loadJsPDF() {
  if (jsPDFLoaded) return jsPDFLoaded;
  jsPDFLoaded = new Promise((resolve, reject) => {
    if (window.jspdf) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { jsPDFLoaded = null; reject(new Error('Failed to load PDF library')); };
    document.head.appendChild(s);
  });
  return jsPDFLoaded;
}

async function exportPDF() {
  if (activeEditor) commitTextEditor();
  const loader = document.getElementById('loader');
  document.getElementById('loader-text').textContent = 'Loading PDF engine…';
  loader.classList.add('show');
  await new Promise(r => setTimeout(r, 30));
  try {
    await loadJsPDF();
    document.getElementById('loader-text').textContent = 'Composing your PDF…';
    await new Promise(r => setTimeout(r, 20));
    const { jsPDF } = window.jspdf;
    const orientation = W >= H ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit:'px', format:[W, H], compress:true });

    // Cover page
    const cover = document.createElement('canvas');
    cover.width = W; cover.height = H;
    const cctx = cover.getContext('2d');
    cctx.fillStyle = '#0f1014';
    cctx.fillRect(0, 0, W, H);
    const g1 = cctx.createRadialGradient(W*0.2, H*0.2, 0, W*0.2, H*0.2, W*0.5);
    g1.addColorStop(0, 'rgba(212,165,116,0.18)'); g1.addColorStop(1, 'transparent');
    cctx.fillStyle = g1; cctx.fillRect(0, 0, W, H);
    cctx.save();
    cctx.translate(W/2, H/2 - 100);
    const grad = cctx.createLinearGradient(-60, -60, 60, 60);
    grad.addColorStop(0, '#ff6b9d'); grad.addColorStop(0.5, '#c268f0'); grad.addColorStop(1, '#6a8dff');
    cctx.fillStyle = grad;
    cctx.beginPath(); cctx.arc(0, 0, 60, 0, Math.PI*2); cctx.fill();
    cctx.fillStyle = 'rgba(255,255,255,0.95)';
    cctx.beginPath();
    cctx.moveTo(-18, 22); cctx.lineTo(-8, 22); cctx.lineTo(20, -14); cctx.lineTo(6, -26); cctx.lineTo(-18, 10);
    cctx.closePath(); cctx.fill();
    cctx.restore();
    cctx.fillStyle = '#f0f0f2';
    cctx.font = 'italic 96px "Instrument Serif", Georgia, serif';
    cctx.textAlign = 'center';
    cctx.fillText("Whiteboard", W/2, H/2 + 50);
    cctx.fillStyle = '#f0c08a';
    cctx.font = '500 18px "JetBrains Mono", monospace';
    const date = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    cctx.fillText('AN INFINITE CANVAS · ' + date.toUpperCase(), W/2, H/2 + 110);
    cctx.fillStyle = '#9c9da6';
    cctx.font = '15px Manrope, sans-serif';
    cctx.fillText(`${state.pages.length} page${state.pages.length>1?'s':''}`, W/2, H - 60);
    pdf.addImage(cover.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');

    for (let i = 0; i < state.pages.length; i++) {
      document.getElementById('loader-text').textContent = `Rendering page ${i+1} of ${state.pages.length}…`;
      await new Promise(r => setTimeout(r, 20));
      const p = state.pages[i];
      const tmp = document.createElement('canvas');
      tmp.width = W; tmp.height = H;
      const tctx = tmp.getContext('2d');
      tctx.fillStyle = '#fdfbf6'; tctx.fillRect(0, 0, W, H);
      if (p.background === 'grid') {
        tctx.strokeStyle = 'rgba(0,0,0,0.07)'; tctx.lineWidth = 1;
        for (let x = 50; x < W; x += 50) { tctx.beginPath(); tctx.moveTo(x,0); tctx.lineTo(x,H); tctx.stroke(); }
        for (let y = 50; y < H; y += 50) { tctx.beginPath(); tctx.moveTo(0,y); tctx.lineTo(W,y); tctx.stroke(); }
      } else if (p.background === 'dots') {
        tctx.fillStyle = 'rgba(0,0,0,0.22)';
        for (let x = 36; x < W; x += 36) for (let y = 36; y < H; y += 36) { tctx.beginPath(); tctx.arc(x, y, 1.2, 0, Math.PI*2); tctx.fill(); }
      } else if (p.background === 'lines') {
        tctx.strokeStyle = 'rgba(0,0,0,0.10)'; tctx.lineWidth = 1;
        for (let y = 48; y < H; y += 48) { tctx.beginPath(); tctx.moveTo(0,y); tctx.lineTo(W,y); tctx.stroke(); }
      }
      for (const im of p.images) drawImage(tctx, im);
      for (const s of p.strokes) drawStroke(tctx, s);
      for (const sh of p.shapes) drawShape(tctx, sh);
      for (const t of p.texts) drawText(tctx, t);
      for (const sn of p.stickies) {
        tctx.save();
        tctx.translate(sn.x*W, sn.y*H); tctx.rotate(sn.rotation*Math.PI/180);
        tctx.fillStyle = 'rgba(0,0,0,0.18)'; tctx.fillRect(4, 6, 240, 200);
        tctx.fillStyle = sn.color; tctx.fillRect(0, 0, 240, 200);
        tctx.fillStyle = '#2a2618';
        tctx.font = '500 26px "Caveat", Georgia, serif'; tctx.textBaseline = 'top';
        const lines = wrapText(tctx, sn.text || '', 215);
        lines.slice(0, 7).forEach((line, idx) => tctx.fillText(line, 16, 22 + idx * 32));
        tctx.restore();
      }
      tctx.save();
      tctx.font = 'italic 22px Georgia, serif'; tctx.fillStyle = 'rgba(0,0,0,0.16)';
      tctx.textAlign = 'right'; tctx.fillText("~ Whiteboard", W - 24, H - 30);
      tctx.font = '14px Manrope, sans-serif'; tctx.fillStyle = 'rgba(0,0,0,0.35)';
      tctx.textAlign = 'left'; tctx.fillText(`${i+1} / ${state.pages.length}`, 24, H - 30);
      tctx.restore();

      pdf.addPage([W, H], orientation);
      pdf.addImage(tmp.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
    }

    pdf.save(`whiteboard-${new Date().toISOString().slice(0,10)}.pdf`);
    hasUnexportedWork = false; updateExportBadge();
    confetti();
    toast('PDF exported ✓');
  } catch (err) {
    console.error(err);
    alert('Export failed: ' + err.message);
  } finally {
    loader.classList.remove('show');
  }
}

function wrapText(ctx, text, maxWidth) {
  const out = []; const paras = text.split('\n');
  for (const para of paras) {
    const words = para.split(/\s+/);
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxWidth && line) { out.push(line); line = w; }
      else line = t;
    }
    if (line) out.push(line);
  }
  return out;
}

document.getElementById('btn-pdf').addEventListener('click', exportPDF);

document.getElementById('btn-jpg').addEventListener('click', () => {
  if (activeEditor) commitTextEditor();
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  tctx.fillStyle = '#fdfbf6'; tctx.fillRect(0, 0, W, H);
  tctx.drawImage(bgCanvas, 0, 0);
  tctx.drawImage(mainCanvas, 0, 0);
  const p = currentPage();
  for (const sn of p.stickies) {
    tctx.save();
    tctx.translate(sn.x*W, sn.y*H); tctx.rotate(sn.rotation*Math.PI/180);
    tctx.fillStyle = 'rgba(0,0,0,0.18)'; tctx.fillRect(4, 6, 240, 200);
    tctx.fillStyle = sn.color; tctx.fillRect(0, 0, 240, 200);
    tctx.fillStyle = '#2a2618';
    tctx.font = '500 26px "Caveat", Georgia, serif'; tctx.textBaseline = 'top';
    const lines = wrapText(tctx, sn.text || '', 215);
    lines.slice(0, 7).forEach((line, idx) => tctx.fillText(line, 16, 22 + idx * 32));
    tctx.restore();
  }
  tctx.save();
  tctx.font = 'italic 22px Georgia, serif'; tctx.fillStyle = 'rgba(0,0,0,0.16)';
  tctx.textAlign = 'right'; tctx.fillText("~ Whiteboard", W - 24, H - 30);
  tctx.restore();
  const a = document.createElement('a');
  a.href = tmp.toDataURL('image/jpeg', 0.94);
  a.download = `whiteboard-page-${state.pageIdx + 1}.jpg`;
  a.click();
  hasUnexportedWork = false; updateExportBadge();
  toast('JPG exported ✓');
});

const modal = document.getElementById('modal-help');
const sg = document.getElementById('shortcuts-grid');
SHORTCUTS.forEach(([label, k]) => {
  const r = document.createElement('div'); r.className = 'shortcut-row';
  r.innerHTML = `<span>${label}</span><kbd>${k}</kbd>`;
  sg.appendChild(r);
});
document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

const btnFocus = document.getElementById('btn-focus');
function toggleFocus(on) {
  const isOn = typeof on === 'boolean' ? on : !document.body.classList.contains('focus-mode');
  document.body.classList.toggle('focus-mode', isOn);
}
btnFocus.addEventListener('click', () => toggleFocus());

let toastTimer;
function toast(msg) {
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000);
}

function confetti() {
  const c = document.createElement('div'); c.className = 'confetti';
  const colors = ['#d4a574','#f0c08a','#c2585b','#2e7dd9','#22a06b','#f4c430','#7c3aed'];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * 0.4) + 's';
    s.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 5500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Shift') state.shiftHeld = true;
  if (e.key === 'Alt') state.altHeld = true;

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  const meta = e.ctrlKey || e.metaKey;

  if (meta && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (meta && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (meta && k === 'n') { e.preventDefault(); addPage(); return; }
  if (meta && k === 'p') { e.preventDefault(); exportPDF(); return; }
  if (meta && k === 'a') { e.preventDefault(); selectTool('select'); selectAll(); return; }

  if (e.key === 'ArrowLeft') { e.preventDefault(); gotoPage(state.pageIdx - 1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); gotoPage(state.pageIdx + 1); return; }
  if (k === 'f' && !meta) { e.preventDefault(); toggleFocus(); return; }
  if (e.key === '[' && !meta) { e.preventDefault(); toggleSidebar(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedItems.length) { e.preventDefault(); deleteSelected(); return; }
  if (e.key === 'Escape') {
    modal.classList.remove('show');
    if (document.body.classList.contains('focus-mode')) toggleFocus(false);
    if (state.selectedItems.length) clearSelection();
    return;
  }

  const map = { p:'pen', h:'highlighter', e:'eraser', v:'select',
                l:'line', r:'rect', o:'ellipse', a:'arrow',
                t:'text', s:'sticky', x:'laser' };
  if (map[k] && !meta) { selectTool(map[k]); }
  if (k === '?' || k === '/') modal.classList.add('show');
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') state.shiftHeld = false;
  if (e.key === 'Alt') state.altHeld = false;
});

document.querySelector('.canvas-frame').style.aspectRatio = `${W} / ${H}`;
markActiveFormat();

state.pages.forEach((p, pageIdx) => {
  (p._pendingImages || []).forEach(pi => {
    if (!pi.src) return;
    const img = new Image();
    const im = { img, x: pi.x, y: pi.y, w: pi.w, h: pi.h };
    p.images.push(im);
    img.onload = () => {
      if (pageIdx === state.pageIdx) renderMain();
      const el = document.getElementById('thumbs').children[pageIdx];
      const cv = el && el.querySelector('canvas');
      if (cv) drawThumb(cv, p);
    };
    img.src = pi.src;
  });
  delete p._pendingImages;
});

renderBackground();
renderMain();
renderThumbs();
gotoPage(0);
fitFrame();
requestAnimationFrame(fitFrame);

if (savedData) toast('Restored your last session ✓');

setTimeout(() => document.getElementById('welcome').classList.add('hide'), 2200);
</script>
