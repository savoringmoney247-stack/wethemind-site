<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Wenvyra Spark: live math tutoring for US students. SAT Math, AP Calculus, Algebra, Geometry. Free 30-minute demo.">
<title>Wenvyra Spark</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#E52421"><link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wenvyra Spark"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#0C1A33;--mut:#5A6578;--line:#E6DFCF;--red:#E52421;--red2:#F0532A;--yel:#FDBB0B;--navy:#0C1A33;--chip:#F3ECDB;--ok:#1F7A4D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1426;--card:#122039;--ink:#F2EEE3;--mut:#9FAAC0;--line:#243556;--red:#FF5A55;--red2:#FF7B4A;--navy:#07101F;--chip:#1A2B49;--ok:#5FD39A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1426;--card:#122039;--ink:#F2EEE3;--mut:#9FAAC0;--line:#243556;--red:#FF5A55;--red2:#FF7B4A;--navy:#07101F;--chip:#1A2B49;--ok:#5FD39A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 100px}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,7vw,2.3rem)}h2{font-size:1.35rem}h3{font-size:1.08rem}
.top{border-bottom:3px solid var(--yel);padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font:600 1.05rem Fredoka,sans-serif;display:flex;gap:8px;align-items:center}
.logo img{border-radius:9px;flex:none;background:#fff}.logo small{display:block;font:700 .66rem Nunito;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:1px}.logo span{line-height:1.05}.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--red),var(--yel));display:grid;place-items:center;color:#fff;font:700 .95rem Fredoka;font-style:normal}
.pill{font:800 .72rem Nunito;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#E52421,#F0532A 55%,#FDBB0B);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:16px}
.hero p{margin:8px 0 14px;font-weight:600}.hero .btn{margin:0 8px 8px 0}
.btn{font:600 1rem Fredoka,Nunito,sans-serif;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;min-height:48px;background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.w{background:#fff;color:#0C1A33}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.full{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.course{border:0;background:transparent;padding:0;display:flex;gap:14px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font:600 1.15rem Fredoka,sans-serif}
.course small{color:var(--mut);font-weight:700}.course div{min-width:0}
.det{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.det ul{margin:6px 0 12px;padding-left:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:14px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{font:600 .98rem Fredoka,Nunito;border:0;border-radius:10px;padding:10px 6px;background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{background:var(--navy);color:#FDBB0B}
.price{font:600 2.4rem/1 Fredoka,sans-serif}.price small{font:700 .95rem Nunito;color:var(--mut)}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:var(--chip);border-radius:99px;padding:4px 11px;font-weight:700;font-size:.84rem}
.tag.g{background:rgba(31,122,77,.14);color:var(--ok)}
label{display:block;font-weight:800;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
select,input[type=text]{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:700 .92rem Nunito;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chips button[aria-pressed=true]{background:var(--navy);color:#FDBB0B;border-color:var(--navy)}
.sum{background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:700;margin-top:16px}
.err{color:var(--red);font-weight:700;font-size:.9rem;margin:8px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
.nav button{flex:1;max-width:170px;font:600 .88rem Fredoka,Nunito;border:0;background:transparent;color:var(--mut);border-radius:12px;padding:8px 4px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button[aria-current=page]{color:var(--red);background:var(--chip)}
.nav svg{width:22px;height:22px}
.foot{color:var(--mut);font-size:.85rem;text-align:center;margin-top:18px}
.foot b{color:var(--ink)}
.small{color:var(--mut);font-size:.85rem}
[hidden]{display:none!important}
/* centered layout */
body,.app{text-align:center}
.top{flex-direction:column;justify-content:center;align-items:center;gap:10px}
.logo{justify-content:center;text-align:left}
.hero,.card,.sum{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .btn{margin:6px 4px}
.course{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.det{width:100%;text-align:center}.det ul,.card ul{list-style:none;padding:0;margin:8px 0 12px}
.det li,.card li{padding:3px 0}
.kv,.chips{justify-content:center}
.price{text-align:center}
label{text-align:center}
select,input[type=text]{text-align:center;text-align-last:center}
.err{text-align:center}
.foot{display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn{text-align:center}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes floaty{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-14px)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#v.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#v.enter>*:nth-child(2){animation-delay:.07s}#v.enter>*:nth-child(3){animation-delay:.14s}#v.enter>*:nth-child(4){animation-delay:.21s}#v.enter>*:nth-child(5){animation-delay:.28s}#v.enter>*:nth-child(6){animation-delay:.35s}#v.enter>*:nth-child(n+7){animation-delay:.42s}
.hero{background-size:220% 220%;animation:drift 9s ease-in-out infinite;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.hero::before{width:120px;height:120px;right:-30px;top:-30px;animation:floaty 7s ease-in-out infinite}
.hero::after{width:70px;height:70px;left:-20px;bottom:-24px;animation:floaty 9s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}
.logo img{animation:wiggle 1.2s .6s ease-in-out 1}
.btn,.chips button,.seg button,.nav button{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background-color .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(229,36,33,.6)}
.btn:active,.chips button:active,.seg button:active,.nav button:active{transform:scale(.95)}
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not(.w)::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s 1s ease-in-out infinite}
.card{transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 26px -16px rgba(12,26,51,.45)}
.det{animation:fade .3s ease both}
.price{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.card p[style*="color:var(--ok)"]{animation:pop .4s both}
.nav button[aria-current=page] svg{animation:pop .4s both}
.chips button[aria-pressed=true],.seg button[aria-pressed=true]{animation:pop .3s both}
.foot{margin-top:22px;gap:2px;line-height:1.35}
.foot>*{margin:0}.foot img{margin-bottom:8px!important}
.foot b{margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.wbtn{display:inline-flex;align-items:center;gap:10px;padding:9px 18px 9px 10px;border-radius:99px;background:linear-gradient(135deg,#0C1A33,#1E3A6E);color:#fff;text-decoration:none;font:600 .98rem Fredoka,Nunito,sans-serif;border:1.5px solid rgba(253,187,11,.7);box-shadow:0 12px 24px -14px rgba(12,26,51,.8);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.wbtn img{border-radius:50%;background:#fff;padding:2px}
.wbtn svg{color:#FDBB0B;transition:transform .2s}
.wbtn:hover{transform:translateY(-3px);box-shadow:0 16px 28px -14px rgba(12,26,51,.9)}.wbtn:hover svg{transform:translate(3px,-3px)}
.wbtn:active{transform:scale(.96)}
.wbtn::after{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,rgba(253,187,11,.35),transparent);animation:shine 3.8s 1.2s ease-in-out infinite}
.foot{margin-top:24px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.pills a,.pills .pl{cursor:pointer;font:700 .85rem Nunito;text-decoration:none;color:var(--ink);background:var(--chip);border:1px solid var(--line);padding:8px 14px;border-radius:99px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s}
.pills a:hover,.pills .pl:hover{transform:translateY(-2px);background:var(--yel);color:#0C1A33}
.logo img.mk,.wbtn img.mk{width:auto;border-radius:0;background:none;padding:0;filter:drop-shadow(0 2px 6px rgba(229,36,33,.25))}
.logo img.mk{height:40px;animation:wiggle 1.2s .6s ease-in-out 1,glow 3.5s 2s ease-in-out infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes glow{0%,100%{filter:drop-shadow(0 2px 6px rgba(229,36,33,.2))}50%{filter:drop-shadow(0 2px 14px rgba(253,187,11,.85))}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wbtn{border:2px solid transparent;background:linear-gradient(135deg,#0C1A33,#1E3A6E) padding-box,conic-gradient(from var(--a),#FDBB0B,#E52421,#FDBB0B,#1E3A6E,#FDBB0B) border-box;animation:spin 4s linear infinite,bob 3.2s ease-in-out infinite;padding:8px 18px 8px 14px;gap:12px}
.wbtn img.mk{height:30px;animation:glow 2.8s ease-in-out infinite}
.wbtn svg{animation:nudge 1.6s ease-in-out infinite}
.wbtn:hover{animation:spin 1.6s linear infinite;transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 4px rgba(253,187,11,.25),0 18px 30px -14px rgba(12,26,51,.9)}
@media (prefers-reduced-motion:reduce){.wbtn{background:linear-gradient(135deg,#0C1A33,#1E3A6E)}}
.wbtn{color:#0C1A33!important;background:linear-gradient(135deg,#FFFFFF,#FFF6DC) padding-box,conic-gradient(from var(--a),#FDBB0B,#E52421,#FDBB0B,#F0532A,#FDBB0B) border-box!important;box-shadow:0 12px 24px -14px rgba(229,36,33,.45)!important}
.wbtn svg{color:#E52421!important}
.wbtn::after{background:linear-gradient(90deg,transparent,rgba(253,187,11,.45),transparent)!important}
.wbtn:hover{box-shadow:0 0 0 4px rgba(253,187,11,.3),0 18px 30px -14px rgba(229,36,33,.5)!important}
@media (prefers-reduced-motion:reduce){.wbtn{background:linear-gradient(135deg,#FFFFFF,#FFF6DC)!important;border-color:#FDBB0B}}
.wbtn>*{position:relative;z-index:1}.wbtn::after{z-index:0!important;background:linear-gradient(90deg,transparent,rgba(253,187,11,.28),transparent)!important}

/* characters */
.chr{display:flex;justify-content:center;margin:0 0 6px}
.chr svg{width:84px;height:84px;overflow:visible}
.hero .lynx{width:104px;height:104px;margin-bottom:2px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.lynx.mini{width:78px;height:78px}
.mascot{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:bottom center;animation:twitch 5s ease-in-out infinite}.ear.e2{animation-delay:-2.4s}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}96%{transform:rotate(4deg)}}
.ic{width:64px;height:64px;border-radius:18px;padding:4px}.ic svg{width:100%;height:100%;overflow:visible}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx{position:absolute;opacity:.14;font:700 28px Fredoka,sans-serif;animation:fxd 12s ease-in-out infinite}
@keyframes fxd{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,-22px) rotate(14deg)}}
.app,nav,header{position:relative;z-index:1}
.std{display:inline-flex;gap:6px;align-items:center;margin:2px 0 10px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.22);color:inherit;font:800 .74rem Nunito,sans-serif;letter-spacing:.03em}
.std.d{background:#FFF6DC;color:#0C1A33;border:1.5px solid #FDBB0B}
@media (prefers-reduced-motion:reduce){.mascot,.blink,.ear,.fx{animation:none!important}}

/* pay sheet */
#ps{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(12,26,51,.55);padding:0 max(0px,env(safe-area-inset-left,0px))}
#ps.on{display:flex}
.pbox{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:pup .3s ease both;max-height:92vh;overflow:auto}
@keyframes pup{from{transform:translateY(40px);opacity:0}}
.pbox h3{margin:6px 0 2px}.pbox .pr{font:700 2.1rem Fredoka,sans-serif;margin:2px 0 10px}
.pbox input{width:100%;margin:5px 0;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);text-align:center}
.pbox input:focus{outline:0;border-color:var(--yel);box-shadow:0 0 0 3px rgba(253,187,11,.3)}
.pbox input.bad{border-color:var(--red)}
.pbox .x{background:none;border:0;color:var(--mut);font:700 .9rem Nunito;cursor:pointer;margin-top:10px;padding:8px}
.perr{color:var(--red);font-weight:700;font-size:.9rem;min-height:1.2em;margin:4px 0}
.pill-btn{background:none}

.mod{text-align:left;border:1.5px solid var(--line);border-radius:14px;margin:7px 0;background:var(--bg);overflow:hidden}
.mod summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-direction:column;gap:1px;position:relative;padding-right:38px}
.mod summary::-webkit-details-marker{display:none}
.mod summary::after{content:"+";position:absolute;right:14px;top:50%;margin-top:-13px;font:700 1.3rem Fredoka;color:var(--red);transition:transform .25s}
.mod[open] summary::after{transform:rotate(45deg)}
.mod summary b{font:600 .98rem Fredoka,sans-serif}.mod summary i{font-style:normal;color:var(--mut);font-size:.84rem;font-weight:700}
.mod ul{margin:0;padding:0 14px 12px 32px;list-style:disc;text-align:left}.mod li{padding:2px 0;font-size:.9rem}
.det .mod ul{list-style:disc;padding:0 14px 12px 32px}
.det .std{margin:0 0 8px}

.alts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.alts span{width:100%;font:800 .72rem Nunito;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.alts a{font:700 .9rem Nunito;text-decoration:none;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);padding:9px 18px;border-radius:99px}
.alts.hot a{background:var(--yel);color:#0C1A33;border-color:var(--yel);animation:pop .5s ease both}

.crew{margin:10px auto 0;max-width:340px}
.crew .row{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.crew .row span{display:block;animation:bob 3s ease-in-out infinite}
.crew .row .hum{filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.qb{display:inline-block;background:#fff;color:#0C1A33;font:700 .9rem Nunito,sans-serif;padding:9px 16px;border-radius:18px;position:relative;margin-bottom:12px;box-shadow:0 6px 16px -8px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
.qb::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.qb.sw{opacity:0;transform:translateY(4px)}
.qhd{display:flex;align-items:center;gap:10px;margin:0 0 12px;text-align:left}
.qhd .hum{flex:none}.qlist{display:flex;flex-direction:column;gap:6px;min-width:0}
.qq{background:var(--bg);border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-weight:700;font-size:.86rem;animation:rise .4s ease both}
.hum.big{margin:0 auto}

.alts button{font:700 .9rem Nunito,sans-serif;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);padding:9px 18px;border-radius:99px;cursor:pointer}

.rlh{font:800 .72rem Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:12px 0 6px}
.rls{display:flex;flex-direction:column;gap:8px}
.rl{display:grid;grid-template-columns:38px 1fr;column-gap:10px;text-align:left;background:linear-gradient(135deg,#FFF6DC,var(--bg));border:1.5px solid var(--line);border-radius:16px;padding:11px 12px;animation:rise .4s ease both}
.rl span{grid-row:1/3;font-size:1.7rem;align-self:center;text-align:center}
.rl b{font:600 .95rem Fredoka,sans-serif}.rl i{font-style:normal;font-size:.84rem;color:var(--mut);font-weight:700}

/* ===== Star theme ===== */
.hero.sky-h{background:linear-gradient(165deg,#1B2559 0%,#4A3F9E 58%,#F2994A 135%);background-size:100% 100%;animation:none}
.hero.sky-h::before,.hero.sky-h::after{background:rgba(253,187,11,.16)}
.kick{font:800 .72rem Nunito,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#FDBB0B;margin:2px 0 4px}
.hero.sky-h .btn:first-of-type{background:#FDBB0B;color:#0C1A33}
.tw{position:absolute;width:9px;height:9px;background:#FFE08A;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 3.6s ease-in-out infinite;pointer-events:none;z-index:0}
.t1{left:9%;top:12%}.t2{right:12%;top:20%;animation-delay:.8s;width:12px;height:12px}.t3{left:16%;bottom:22%;animation-delay:1.6s}.t4{right:8%;bottom:30%;animation-delay:2.2s}.t5{left:48%;top:6%;animation-delay:1.1s;width:7px;height:7px}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.skyc{background:linear-gradient(160deg,#16204E,#2C2F70);border:0;color:#fff;gap:2px}
.skyh{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-family:Fredoka,Nunito,sans-serif}
.skyh b{font-size:1.1rem}.skyh span{font:800 .78rem Nunito,sans-serif;color:#FDBB0B}
.skyc svg{width:100%;height:auto;max-width:340px;margin:4px 0}
.skyc .sk{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.5;stroke-dasharray:2 2}
.skyc .sl{fill:#FDBB0B;stroke:#FFE08A;stroke-width:1;filter:drop-shadow(0 0 5px rgba(253,187,11,.9));animation:glw 3s ease-in-out infinite}
.skyc .ln{stroke:rgba(255,224,138,.85);stroke-width:1.5}
.skyc text{font:800 9px Nunito,sans-serif;fill:rgba(255,255,255,.6)}.skyc text.on{fill:#FFE08A}
@keyframes glw{50%{filter:drop-shadow(0 0 9px rgba(253,187,11,1))}}
.skym{margin:2px 0 0;font-weight:700;font-size:.92rem;color:#E8E6FF}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);max-width:92vw;background:#16204E;color:#fff;border:1.5px solid #FDBB0B;padding:10px 16px;border-radius:16px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.35s;z-index:99;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast b{color:#FDBB0B}
@media (prefers-reduced-motion:reduce){.tw,.skyc .sl{animation:none}}

.regions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:18px auto 4px;max-width:420px}
.regions span{width:100%;text-align:center;font:800 .72rem Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.regions a{font:700 .88rem Nunito,sans-serif;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);padding:8px 14px;border-radius:99px}
.regions a.on{background:var(--yel);border-color:var(--yel);color:#0C1A33}
#inst{display:none;margin:14px auto 0;justify-content:center}
#inst.on{display:inline-flex}
#ios{display:none;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;max-width:420px;margin:0 auto;background:var(--card);border:2px solid var(--yel);border-radius:18px;padding:14px 16px;text-align:center;box-shadow:0 16px 40px -12px rgba(0,0,0,.35);font-weight:700}
#ios.on{display:block;animation:pup .3s ease both}
#ios button{background:none;border:0;color:var(--mut);font:700 .85rem Nunito;margin-top:6px;cursor:pointer}

const PUZ=[['x² − 6x + k = 0 has exactly one real solution. What is k?','k = 9, because the discriminant 36 − 4k must be 0.'],['What is the minimum value of f(x) = 2x² − 8x + 5?','−3. The vertex is at x = 2, and f(2) = −3.'],['The system y = 2x + 3 and y = ax − 5 has no solution. What is a?','a = 2. Same slope, different intercepts, so the lines never meet.'],['A line passes through (1, 5) and (4, 14). Where does it cross the y-axis?','(0, 2). The slope is 3, so y = 3x + 2.'],['If (x − 3)/(x + 2) = 2/3, what is x?','x = 13. Cross-multiply: 3x − 9 = 2x + 4.'],['A circle has equation x² + y² − 4x + 6y = 12. What is its radius?','5. Complete the square: (x − 2)² + (y + 3)² = 25.'],['If sin θ = 3/5 and θ is acute, what is tan θ?','3/4. This is the 3-4-5 triangle.']];
