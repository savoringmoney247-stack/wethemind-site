<!DOCTYPE html> <html lang="en-US"> <head> <meta charset="utf-8"/> <meta content="width=device-width,initial-scale=1" name="viewport"/> <meta content="noindex, nofollow" name="robots"/> <title>Portal Login — We The Mind</title> <link href="assets/portal.css" rel="stylesheet"/> <link href="../assets/voice.css?v=20261018b" rel="stylesheet"/><meta content="portal" name="wtm-voice"/><meta content="We The Mind — learn, build, grow. Math tutoring, personal finance, tech and free tools." name="description"/><link href="https://wethemind.com/portal/" rel="canonical"/><meta content="website" property="og:type"/><meta content="Portal Login — We The Mind" property="og:title"/><meta content="We The Mind — learn, build, grow. Math tutoring, personal finance, tech and free tools." property="og:description"/><meta content="https://wethemind.com/portal/" property="og:url"/><meta content="We The Mind" property="og:site_name"/><meta content="en_US" property="og:locale"/><meta content="https://wethemind.com/assets/og-image.png" property="og:image"/><meta content="1200" property="og:image:width"/><meta content="630" property="og:image:height"/><meta content="We The Mind — one mind, every curriculum" property="og:image:alt"/><meta content="summary_large_image" name="twitter:card"/><meta content="Portal Login — We The Mind" name="twitter:title"/><meta content="We The Mind — learn, build, grow. Math tutoring, personal finance, tech and free tools." name="twitter:description"/><meta content="https://wethemind.com/assets/og-image.png" name="twitter:image"/><meta content="#E52421" name="theme-color"/><link href="../assets/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="../favicon.ico" rel="shortcut icon"/><link href="../assets/apple-touch-icon.png" rel="apple-touch-icon"/></head> <body> <div class="login-wrap"> <div class="login-card"> <h1>We The Mind <span style="color:var(--gold)">Portal</span></h1> <p class="sub">Student, teacher &amp; admin login</p> <form id="login-form"> <div class="field" style="text-align:left"> <label for="email">Email</label> <input autocomplete="username" id="email" required="" type="email"/> </div> <div class="field" style="text-align:left"> <label for="password">Password</label> <input autocomplete="current-password" id="password" required="" type="password"/> </div> <button class="btn" style="width:100%;justify-content:center" type="submit">Log In</button> <p class="error-msg" id="error-msg"></p> </form> </div> </div> <script type="module">import{login,auth}from"./assets/auth.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";onAuthStateChanged(auth,async user=>{if(user){const token=await user.getIdTokenResult();const role=token.claims.role;if(role)window.location.href="/"+role+"/"}});document.getElementById("login-form").addEventListener("submit",async function(e){e.preventDefault();const errorEl=document.getElementById("error-msg");errorEl.style.display="none";const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;try{await login(email,password)}catch(err){errorEl.textContent="Login failed ("+(err.code||"unknown")+"): "+err.message;errorEl.style.display="block";console.error("Login error:",err)}})</script> <script defer="" src="../assets/voice.js?v=20261018b"></script></body> </html>
