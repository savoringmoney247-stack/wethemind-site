<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>Portal Login — We The Mind</title>
<link href="assets/portal.css" rel="stylesheet"/>
<link href="../assets/voice.css" rel="stylesheet"/><meta content="portal" name="wtm-voice"/><meta content="We The Mind — learn, build, grow. Math tutoring, personal finance, tech and free tools." name="description"/></head>
<body>
<div class="login-wrap">
<div class="login-card">
<h1>We The Mind <span style="color:var(--gold);">Portal</span></h1>
<p class="sub">Student, teacher &amp; admin login</p>
<form id="login-form">
<div class="field" style="text-align:left;">
<label for="email">Email</label>
<input autocomplete="username" id="email" required="" type="email"/>
</div>
<div class="field" style="text-align:left;">
<label for="password">Password</label>
<input autocomplete="current-password" id="password" required="" type="password"/>
</div>
<button class="btn" style="width:100%; justify-content:center;" type="submit">Log In</button>
<p class="error-msg" id="error-msg"></p>
</form>
</div>
</div>
<script type="module">
  import { login, auth } from "./assets/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const token = await user.getIdTokenResult();
      const role = token.claims.role;
      if (role) window.location.href = "/" + role + "/";
    }
  });

  document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await login(email, password);
      // onAuthStateChanged above handles the redirect once the token/claims are ready.
    } catch (err) {
      errorEl.textContent = "Login failed (" + (err.code || "unknown") + "): " + err.message;
      errorEl.style.display = "block";
      console.error("Login error:", err);
    }
  });
</script>
<script defer="" src="../assets/voice.js"></script></body>
</html>
